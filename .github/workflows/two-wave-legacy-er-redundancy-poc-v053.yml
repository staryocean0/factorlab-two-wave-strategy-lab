name: two-wave-legacy-er-redundancy-poc-v053
on:
  workflow_dispatch:
  push:
    branches: ['codex/two-wave-phase1-20260905']
    paths:
      - 'scripts/run_two_wave_legacy_er_redundancy_poc_v053.py'
      - 'docs/research/two_wave_legacy_er_redundancy_ablation_protocol_v053.md'
      - '.github/workflows/two-wave-legacy-er-redundancy-poc-v053.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: two-wave-legacy-er-redundancy-poc-v053-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  read-only-legacy-er-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e . editables==0.6
      - name: Validate bounded package and frozen data
        run: |
          mkdir -p v053_legacy_er_ablation_proof/source
          python scripts/validate_theme_package.py | tee v053_legacy_er_ablation_proof/package_validation.json
          git rev-parse HEAD > v053_legacy_er_ablation_proof/commit.txt
      - name: Full regression before legacy ER ablation
        run: python -m pytest -q --junitxml=v053_legacy_er_ablation_proof/tests.xml | tee v053_legacy_er_ablation_proof/tests.log
      - name: Run frozen v0.5.2 with only legacy raw ER gate removed
        run: |
          python scripts/run_two_wave_legacy_er_redundancy_poc_v053.py | tee v053_legacy_er_ablation_proof/research.log
          git diff --exit-code -- data src tests scripts docs/research pyproject.toml
      - name: Retain exact source and environment
        if: always()
        run: |
          python -m pip freeze > v053_legacy_er_ablation_proof/environment.txt
          cp scripts/run_two_wave_legacy_er_redundancy_poc_v053.py v053_legacy_er_ablation_proof/source/
          cp docs/research/two_wave_legacy_er_redundancy_ablation_protocol_v053.md v053_legacy_er_ablation_proof/source/
          cp docs/research/two_wave_leg_efficiency_definition_results_v053.md v053_legacy_er_ablation_proof/source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-wave-legacy-er-redundancy-poc-v053-${{ github.sha }}
          path: |
            cloud_results/two_wave_legacy_er_redundancy_poc_v053/
            v053_legacy_er_ablation_proof/
          retention-days: 30
          if-no-files-found: error
