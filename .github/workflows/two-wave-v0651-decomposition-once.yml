name: two-wave-v0651-decomposition-once

on:
  push:
    branches:
      - research/two-wave-left-boundary-internal-pivot-decomposition-v0651
    paths-ignore:
      - experiments/two_wave_left_boundary_internal_pivot_decomposition_v0651/RESULT.json

permissions:
  contents: write

jobs:
  decompose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Run frozen v0.6.51 correspondence decomposition
        run: python scripts/run_two_wave_left_boundary_internal_pivot_decomposition_v0651.py
      - name: Commit aggregate result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_left_boundary_internal_pivot_decomposition_v0651/RESULT.json
          if git diff --cached --quiet; then
            echo "No v0651 result change"
            exit 0
          fi
          git commit -m "Record formal v0651 left-boundary internal-pivot decomposition [skip ci]"
          git push origin HEAD:research/two-wave-left-boundary-internal-pivot-decomposition-v0651
