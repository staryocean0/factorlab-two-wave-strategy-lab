name: two-wave-native-open-body-gap-direction-v0646-once

on:
  push:
    branches:
      - research/two-wave-native-open-body-gap-v0646
    paths-ignore:
      - experiments/two_wave_native_open_body_gap_direction_v0646/**

permissions:
  actions: read
  contents: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q

  attribution:
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Download frozen v0618 identity artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34423674192
          pattern: v0618-5m_offset_*
          path: tmp/v0646_input
          merge-multiple: true
      - name: Run frozen v0646 native open body gap direction attribution
        run: >-
          python scripts/run_two_wave_native_open_body_gap_direction_v0646.py
          --input tmp/v0646_input
          --output experiments/two_wave_native_open_body_gap_direction_v0646
      - uses: actions/upload-artifact@v4
        with:
          name: v0646-native-open-body-gap-direction
          path: experiments/two_wave_native_open_body_gap_direction_v0646/
          retention-days: 30
      - name: Commit formal v0646 attribution bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_native_open_body_gap_direction_v0646
          if git diff --cached --quiet; then
            echo "Result bundle already identical; nothing to commit."
            exit 0
          fi
          git commit -m "Record formal v0646 native open body gap attribution"
          git push
