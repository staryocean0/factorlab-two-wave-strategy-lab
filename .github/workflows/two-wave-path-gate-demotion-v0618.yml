name: two-wave-path-gate-demotion-v0618-once

on:
  push:
    branches:
      - research/two-wave-path-gate-demotion-v0618
    paths-ignore:
      - experiments/two_wave_path_gate_demotion_v0618/**

permissions:
  contents: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q

  replay-view:
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        view:
          - 5m_offset_0
          - 5m_offset_1
          - 5m_offset_2
          - 5m_offset_3
          - 5m_offset_4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Replay frozen publication and qualification
        run: >-
          python scripts/run_two_wave_path_gate_demotion_v0618_view.py
          --view ${{ matrix.view }}
          --output tmp/v0618/${{ matrix.view }}
      - uses: actions/upload-artifact@v4
        with:
          name: v0618-${{ matrix.view }}
          path: tmp/v0618/${{ matrix.view }}/
          compression-level: 6
          retention-days: 14

  aggregate:
    needs: replay-view
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: v0618-*
          path: tmp/v0618_shards
      - name: Apply frozen promotion gate
        run: >-
          python scripts/aggregate_two_wave_path_gate_demotion_v0618.py
          --input tmp/v0618_shards
          --output experiments/two_wave_path_gate_demotion_v0618
      - uses: actions/upload-artifact@v4
        with:
          name: v0618-final-result
          path: experiments/two_wave_path_gate_demotion_v0618/
          retention-days: 30
      - name: Commit formal result bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_path_gate_demotion_v0618
          git commit -m "Record formal v0618 path-gate demotion result"
          git push
