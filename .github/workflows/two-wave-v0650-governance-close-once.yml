name: two-wave-v0650-governance-close-once

on:
  push:
    branches:
      - research/two-wave-semantic-object-parent-representation-audit-v0650

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Synchronize v0650 governance and root status
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          authority_path = root / 'experiments/two_wave_m0_authority.json'
          a = json.loads(authority_path.read_text())
          a['schema'] = 'two_wave_m0_authority@1.22'
          a['global_status'] = 'v0650_parent_representation_correspondence_not_identified_left_boundary_internal_pivot_decomposition_next'

          parent = a['component_authority']['parent_identity']
          parent['status'] = 'supported_research_component_independent_reference_correspondence_unresolved'
          parent['independent_reference_correspondence_status'] = 'mixed_or_indeterminate'
          parent['v0650_median_parent_interval_iou'] = 0.7741935483870968
          parent['v0650_median_anchor_mae_fraction'] = 0.12421052631578948
          parent['v0650_median_start_boundary_error_bars'] = 17.0
          parent['v0650_median_end_boundary_error_bars'] = 4.0

          q = a['component_authority']['qualification_policy']
          q['status'] = 'development_champion_failed_independent_reference_calibration_parent_correspondence_unresolved'
          q['development_champion'] = True
          q['independent_reference_calibrated'] = False

          pd = a['component_authority']['parent_direction']
          pd['status'] = 'blocked_no_winner_upstream_parent_object_and_qualification_not_reference_validated'

          a['semantic_object_parent_representation_audit'] = {
              'v0650': {
                  'status': 'complete_parent_representation_correspondence_not_identified',
                  'protocol': 'docs/research/TWO_WAVE_SEMANTIC_OBJECT_PARENT_REPRESENTATION_AUDIT_V0650_PROTOCOL.md',
                  'protocol_freeze_commit': 'f7c80c2331c7bbefbe1dd4dcc4b0669e92c2113a',
                  'formal_workflow_run': 34666720984,
                  'formal_result_commit': '51657926c71e0308d64a233405f9363073e8997b',
                  'result': 'experiments/two_wave_semantic_object_parent_representation_v0650/RESULT.json',
                  'result_card': 'experiments/two_wave_semantic_object_parent_representation_v0650/RESULT_CARD.md',
                  'adjudication': 'experiments/two_wave_semantic_object_parent_representation_v0650/ADJUDICATION.json',
                  'candidate_cases': 120,
                  'reference_no_candidates': 104,
                  'reference_yes_candidates': 16,
                  'usable_human_anchor_cases': 11,
                  'multi_identity_candidate_cutoffs': 2,
                  'reference_no_full_visibility_incidence': 1.0,
                  'reference_yes_full_visibility_incidence': 1.0,
                  'right_edge_gap_rank_no_gt_yes': 0.5018028846153846,
                  'parent_span_rank_no_lt_yes': 0.6213942307692307,
                  'anchor_correspondence_status': 'mixed_or_indeterminate',
                  'median_interval_iou': 0.7741935483870968,
                  'median_anchor_mae_fraction': 0.12421052631578948,
                  'median_start_boundary_abs_error_bars': 17.0,
                  'median_end_boundary_abs_error_bars': 4.0,
                  'median_span_ratio': 1.2678571428571428,
                  'packet_window_visibility_failure': False,
                  'right_edge_staleness_supported': False,
                  'smaller_parent_size_supported': False,
                  'model_fragment_of_human_parent': False,
                  'model_overwide_relative_to_human_parent': False,
                  'primary_category': 'v0650_parent_representation_correspondence_not_identified',
                  'threshold_fitting_performed': False,
                  'qualification_changed': False,
                  'direction_winner_changed': False,
                  'morphology_acceptance_changed': False,
                  'trade_authority_changed': False,
                  'production_authority_changed': False,
              }
          }
          a['current_parent_representation_status'] = 'v0650_complete_mixed_outer_interval_overlap_left_boundary_internal_anchor_correspondence_unresolved'
          a['current_independent_reference_calibrated_qualification_authority'] = None
          a['next_authorized_step'] = (
              'freeze a read-only left-boundary / internal-pivot correspondence decomposition using only the frozen v0648 final-reference anchors; '
              'separate start-boundary displacement from internal pivot displacement and end-boundary agreement; '
              'do not fit boundary tolerances, pivot remapping, span filters, or a semantic-object challenger directly to v0648 labels'
          )
          a['no_current_direction_challenger_authorized'] = True
          a['no_current_semantic_object_challenger_authorized'] = True
          forbidden = a.setdefault('forbidden_next_shortcuts', [])
          for item in [
              'fit_a_17_bar_start_boundary_tolerance_from_v0650',
              'fit_a_0_124_anchor_mae_threshold_from_v0650',
              'choose_multi_identity_candidate_by_best_human_anchor_match',
              'time_warp_or_permute_model_pivots_to_maximize_v0648_human_alignment',
              'widen_or_narrow_parent_boundaries_directly_to_match_v0648_reference_anchors',
              'declare_v052_parent_identity_rejected_from_mixed_v0650_correspondence',
              'resume_parent_direction_feature_mining_before_left_boundary_internal_pivot_decomposition'
          ]:
              if item not in forbidden:
                  forbidden.append(item)
          authority_path.write_text(json.dumps(a, ensure_ascii=False, indent=2) + '\n')

          human_path = root / 'docs/research/TWO_WAVE_M0_AUTHORITY.md'
          h = human_path.read_text()
          section = '''\n\n## v0.6.50: semantic-object / parent-representation audit — complete; correspondence mixed / not identified\n\nFrozen protocol: `docs/research/TWO_WAVE_SEMANTIC_OBJECT_PARENT_REPRESENTATION_AUDIT_V0650_PROTOCOL.md`.  \nProtocol freeze commit: `f7c80c2331c7bbefbe1dd4dcc4b0669e92c2113a`.  \nFormal workflow run: `34666720984`.  \nFormal result commit: `51657926c71e0308d64a233405f9363073e8997b`.  \nResult: `experiments/two_wave_semantic_object_parent_representation_v0650/RESULT.json`.  \nResult card: `experiments/two_wave_semantic_object_parent_representation_v0650/RESULT_CARD.md`.  \nGovernance adjudication: `experiments/two_wave_semantic_object_parent_representation_v0650/ADJUDICATION.json`.\n\nThe v0.6.48 chart window itself is not the failure: all `104/104` reference-negative and `16/16` reference-positive algorithmic five-anchor parents are fully visible in the frozen 96-bar packet. Right-edge gap is also indistinguishable (`4`-bar median in both groups; rank `0.5018`). The reference-negative parents are somewhat shorter, but the prespecified smaller-parent rank is only `0.6214`, below the `0.70` support threshold.\n\nDirect parent correspondence is identifiable because `11/16` reference-positive cases have complete valid frozen final-reference `p0..p4`. On those 11 cases, median outer-interval IoU is `0.7742`, but normalized five-anchor MAE is `0.1242`. This passes neither the frozen strong-correspondence band (`IoU>=0.70` and MAE<=`0.08`) nor the strong-mismatch band (`IoU<0.50` or MAE>`0.15`). Median start-boundary error is `17` bars versus only `4` bars at the end boundary; containment is heterogeneous rather than systematically fragmentary or over-wide.\n\nFormal verdict: **`v0650_parent_representation_correspondence_not_identified`**.\n\nInterpretation: the algorithmic and human objects are not simply disjoint — their outer intervals overlap materially and the right boundary is often close — but the left boundary and internal five-anchor decomposition do not establish strong correspondence. v0.5.2 exact-ridge parent identity remains a supported research component, but its independent-reference correspondence is unresolved. No boundary tolerance, pivot remapping, span gate, qualification change, semantic-object challenger, or direction challenger is authorized.\n\nThe next authorized step is a separately frozen read-only left-boundary / internal-pivot correspondence decomposition. `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`.\n'''
          if '## v0.6.50: semantic-object / parent-representation audit' not in h:
              h += section
          human_path.write_text(h)

          ledger_path = root / 'docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md'
          l = ledger_path.read_text()
          ledger_section = '''\n\n## v0.6.50 parent representation audit\n\n- This is upstream representation evidence, not a direction contribution.\n- All 120 candidate algorithmic parents were fully visible in the human packet; chart truncation and right-edge staleness are ruled out.\n- Smaller-parent evidence is sub-threshold (`P(span_no<span_yes)+0.5tie = 0.6214`).\n- `11/16` human-positive cases support direct anchor comparison: median interval IoU `0.7742`, normalized five-anchor MAE `0.1242`, start-boundary error `17` bars, end-boundary error `4` bars.\n- Frozen classification: `mixed_or_indeterminate`; formal category `v0650_parent_representation_correspondence_not_identified`.\n- No parent-boundary rule, pivot remapping, qualification gate, semantic-object challenger, or direction challenger is authorized.\n'''
          if '## v0.6.50 parent representation audit' not in l:
              l += ledger_section
          ledger_path.write_text(l)

          index_path = root / 'docs/INDEX.md'
          idx = index_path.read_text()
          idx_section = '''\n\n### v0.6.50 semantic-object / parent-representation audit — complete\n\n- Protocol: `research/TWO_WAVE_SEMANTIC_OBJECT_PARENT_REPRESENTATION_AUDIT_V0650_PROTOCOL.md`\n- Result: `../experiments/two_wave_semantic_object_parent_representation_v0650/RESULT.json`\n- Result card: `../experiments/two_wave_semantic_object_parent_representation_v0650/RESULT_CARD.md`\n- Governance adjudication: `../experiments/two_wave_semantic_object_parent_representation_v0650/ADJUDICATION.json`\n- Verdict: `v0650_parent_representation_correspondence_not_identified`; outer intervals overlap, but left-boundary/internal-anchor correspondence remains unresolved.\n- Next: separately freeze a read-only left-boundary / internal-pivot correspondence decomposition.\n'''
          if '### v0.6.50 semantic-object / parent-representation audit — complete' not in idx:
              idx += idx_section
          index_path.write_text(idx)

          readme_path = root / 'README.md'
          r = readme_path.read_text()
          r = r.replace(
              '- qualification policy: **v0.6.18 path-gate demotion** — current best research qualification component;',
              '- qualification policy: **v0.6.18 path-gate demotion** — Development-era champion, but failed independent reference calibration;'
          )
          old = '''Current global stage is therefore **semantic-object / parent-representation audit required**. Parent-direction winner remains unset; `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`. The next authorized action is a separately frozen read-only audit of whether the algorithmic exact-ridge/published-five-anchor object and its parent boundaries correspond to the independently annotated visible parent object. Residual gate mining, v0.6.18 threshold fitting, restored path vetoes, amplitude cutoff fitting, and renewed direction micro-feature mining remain unauthorized.'''
          new = '''v0.6.50 completed that semantic-object / parent-representation audit. All 120 candidate algorithmic parents were fully visible in the frozen human chart, and right-edge staleness was absent. Among the 11 reference-positive cases with complete human p0-p4 anchors, the outer parent intervals overlap reasonably well (median IoU `0.7742`) but the full five-anchor alignment remains only mixed (normalized anchor MAE `0.1242`); the start boundary differs by a median `17` bars while the end boundary differs by only `4` bars. The formal verdict is **`v0650_parent_representation_correspondence_not_identified`**.\n\nCurrent global stage is therefore **left-boundary / internal-pivot correspondence decomposition required**. v0.5.2 remains a supported research parent-identity component, but independent-reference correspondence is unresolved. Parent-direction winner remains unset; `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`. The next authorized action is a separately frozen read-only decomposition of start-boundary versus internal-pivot versus end-boundary correspondence. Fitting a 17-bar tolerance, fitting an anchor-MAE threshold, remapping pivots to the human labels, changing parent span to match labels, residual gate mining, or renewed direction micro-feature mining remain unauthorized.'''
          if old in r:
              r = r.replace(old, new)
          readme_path.write_text(r)
          PY

      - name: Commit v0650 governance closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_m0_authority.json docs/research/TWO_WAVE_M0_AUTHORITY.md docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md docs/INDEX.md README.md
          git commit -m "Close v0650 parent representation audit governance [skip ci]"
          git push origin HEAD:research/two-wave-semantic-object-parent-representation-audit-v0650
