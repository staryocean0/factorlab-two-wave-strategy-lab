name: R7-L2-risk-bucket-calibration-diagnostic

on:
  push:
    branches:
      - codex/two-wave-phase1-20260905
    paths:
      - '.github/workflows/R7-L2-risk-bucket-calibration-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-R7-L2-state-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded dependencies
        run: python -m pip install 'numpy>=2.0,<2.6' 'pandas>=2.3,<3' 'pyarrow>=19,<20' 'pytest>=8.3,<9'
      - name: Verify frozen artifacts and sources
        run: |
          test "$(git hash-object docs/research/R7_L2_5m_risk_bucket_calibration_diagnostic_preanalysis_20260916.md)" = "aea4733d32bce4303692bd1c3ca193734976221c"
          test "$(git hash-object docs/governance/R7_L2_5m_risk_bucket_calibration_diagnostic_protocol_v1.json)" = "a905a27cc2af5dbade85c93acaf25733a7aad8d3"
          test "$(git hash-object scripts/diagnose_R7_L2_5m_risk_bucket_calibration.py)" = "a6496f21e4bc019c7782a7fdc9634a6fa83851c4"
          test "$(git hash-object tests/unit/test_R7_L2_5m_risk_bucket_calibration.py)" = "655fd60d25dd037d5e2cb0d56d20f2e00339f9af"
          test "$(git hash-object scripts/run_R7_native_1m_rejected_excursion.py)" = "e42ba3a260b2ed8c5fc3c6be548e73f5245b8e30"
          test "$(git hash-object scripts/inventory_R7_layer2_5m_risk_state_alignment.py)" = "315da5b6b7e1dc3fc72958eb2ba6b573d3a32397"
          test "$(git hash-object docs/governance/R7_layer2_5m_risk_state_reference_contract_v1.json)" = "138f150fad8b87e3fda13d2ce948ffe1d83e1c6b"
          test "$(git hash-object docs/research/local_R7_L2_5m_risk_state_alignment_inventory_receipt_v1.json)" = "bceb333704f3f970408d6a7f0883ba74ac1e3d15"
          test "$(git hash-object docs/governance/R7_L2_5m_risk_bucket_calibration_diagnostic_execution_freeze_v1.json)" = "2a36c9bacbfe5a48206f59533b6cffdf216220e7"
          python - <<'PY'
          import hashlib
          targets={
            'data/development/1m_official.parquet':'755217afce9dec383e48cd46d591402fa90dc50897abeb3dc7097c9a18a109d4',
            'data/development/5m_offset_0.parquet':'bea21fa9dd9532e21605511e07561b33d5569f86f69f5a487507531593b14c48',
          }
          for p,e in targets.items():
              h=hashlib.sha256(open(p,'rb').read()).hexdigest()
              assert h==e,(p,h)
          print('frozen identities verified')
          PY
      - name: Run frozen state diagnostic tests
        run: python -m pytest -q tests/unit/test_R7_L2_5m_risk_bucket_calibration.py
      - name: Execute frozen state-conditioned diagnostic
        run: python scripts/diagnose_R7_L2_5m_risk_bucket_calibration.py --output /tmp/R7_L2_5m_risk_bucket_calibration_diagnostic_receipt_v1.json
      - name: Verify authority boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/R7_L2_5m_risk_bucket_calibration_diagnostic_receipt_v1.json').read_text())
          assert x['BLACKBOX_read'] is False
          assert x['post_2020_rows_read'] is False
          assert x['PnL_read'] is False
          assert x['fresh_OOS_claim'] is False
          assert x['production_authority'] is False
          assert x['entry_reproduction']['pass'] is True
          assert x['supply']['pass'] is True
          print(x['adjudication'])
          PY
      - name: Upload diagnostic receipt only
        uses: actions/upload-artifact@v4
        with:
          name: R7-L2-risk-bucket-calibration-diagnostic-receipt
          path: /tmp/R7_L2_5m_risk_bucket_calibration_diagnostic_receipt_v1.json
          if-no-files-found: error
