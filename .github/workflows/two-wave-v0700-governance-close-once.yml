name: two-wave-v0700-governance-close-once

on:
  push:
    branches:
      - research/two-wave-semantic-bridge-counteroffensive-v0700

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Synchronize v0700 counteroffensive governance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          authority_path = root / 'experiments/two_wave_m0_authority.json'
          a = json.loads(authority_path.read_text())
          a['schema'] = 'two_wave_m0_authority@1.25'
          a['global_status'] = 'v0700_counteroffensive_localized_first_semantic_break_at_exact_five_ridge_tuple_objectization_v0701_reconstruction_next'

          parent = a['component_authority']['parent_identity']
          parent['version'] = 'v0.5.2'
          parent['status'] = 'exact_ridge_five_tuple_not_semantic_parent_authority_objectization_requires_reconstruction'
          parent['independent_reference_correspondence_status'] = 'semantic_bridge_failure_localized_at_exact_tuple_objectization'
          parent['v0700_L1_common_scale_ridge_support'] = 10
          parent['v0700_L2_exact_tuple_support'] = 3
          parent['v0700_decisive_transition'] = 'L1_to_L2'

          same = a['component_authority']['same_scale_semantics']
          same['status'] = 'historical_component_awaiting_transplantation_retest_on_repaired_semantic_parent_object'

          rawpub = a['component_authority']['raw_identity_publication']
          rawpub['status'] = 'historical_component_awaiting_transplantation_retest_not_declared_false'

          q = a['component_authority']['qualification_policy']
          q['status'] = 'development_champion_on_legacy_object_awaiting_transplantation_retest_on_repaired_parent_object'
          q['development_champion'] = True
          q['independent_reference_calibrated'] = False

          pd = a['component_authority']['parent_direction']
          pd['status'] = 'historical_direction_components_awaiting_transplantation_retest_after_semantic_parent_reconstruction'
          pd['winner'] = None

          a['semantic_bridge_counteroffensive'] = {
              'v0700': {
                  'status': 'complete_first_break_localized_at_exact_five_ridge_tuple_objectization',
                  'protocol': 'docs/research/TWO_WAVE_SEMANTIC_BRIDGE_COUNTEROFFENSIVE_V0700_PROTOCOL.md',
                  'protocol_freeze_commit': '525948dc7f22a01fdfd6df453a935181df41e0f6',
                  'formal_workflow_run': 34671433841,
                  'formal_result_commit': '4c0fc9366dd8e2ce6537f9c384c24d90f2d2f920',
                  'result': 'experiments/two_wave_semantic_bridge_counteroffensive_v0700/RESULT.json',
                  'result_card': 'experiments/two_wave_semantic_bridge_counteroffensive_v0700/RESULT_CARD.md',
                  'adjudication': 'experiments/two_wave_semantic_bridge_counteroffensive_v0700/ADJUDICATION.json',
                  'anchored_reference_positive_cases': 11,
                  'salvage_threshold_cases': 8,
                  'layer_support_counts': {'L0': 11, 'L1': 10, 'L2': 3, 'L3': 3, 'L4': 2, 'L5': 3},
                  'decisive_transition': 'L1_to_L2',
                  'L1_true_L2_false_cases': 7,
                  'L2_true_L3_false_cases': 0,
                  'primary_category': 'v0700_ridge_infrastructure_salvage_supported_exact_tuple_objectization_breaks_semantic_bridge',
                  'development_discovery_only': True,
                  'new_object_constructor_fitted': False,
                  'threshold_fitting_performed': False,
                  'qualification_changed': False,
                  'direction_winner_changed': False,
                  'morphology_acceptance_changed': False,
                  'trade_authority_changed': False,
                  'production_authority_changed': False
              }
          }
          a['counteroffensive_component_retention'] = {
              'data_clock_source_replay_governance': 'retain_without_semantic_change',
              'tcss_extrema_ridge_infrastructure': 'retain_as_support_infrastructure_but_not_parent_authority',
              'exact_ridge_five_tuple_objectization': 'reconstruct_or_revalidate',
              'tuple_birth_causal_adjacency_rule': 'awaiting_transplantation_retest_after_objectization_repair',
              'legacy_filtered_parent_identity': 'reconstruct_or_revalidate',
              'raw_projection_v064_v065': 'awaiting_transplantation_retest_not_declared_false',
              'same_scale_v054_and_qualification_v0618': 'awaiting_transplantation_retest_not_declared_false',
              'direction_D1_v0625': 'awaiting_transplantation_retest_not_declared_false'
          }
          a['current_independent_reference_calibrated_qualification_authority'] = None
          a['no_current_direction_challenger_authorized'] = True
          a['no_current_semantic_object_challenger_authorized'] = True
          a['next_authorized_step'] = (
              'v0.7.1 ridge-supported semantic parent objectization reconstruction: retain causal TCSS extrema/ridge infrastructure; '
              'replace exact-consecutive-five-ridge-tuple as the default semantic-parent bridge with separately frozen structural object families; '
              'do not fit bar-distance tolerances to the 11 anchored reference cases; after selecting a repaired semantic object, transplant and retest tuple-birth timing, raw projection/publication, same-scale qualification, and direction in that order'
          )
          forbidden = a.setdefault('forbidden_next_shortcuts', [])
          for item in [
              'declare_all_v06_downstream_results_false_due_to_v0700',
              'discard_tcss_ridge_infrastructure_after_v0700',
              'fit_nearest_ridge_distance_tolerance_to_11_v0700_cases',
              'repair_v0700_by_relaxing_exact_tuple_consecutiveness_without_separately_frozen_object_family',
              'reuse_v0618_or_v0625_as_active_authority_before_transplantation_retest',
              'skip_objectization_reconstruction_and_resume_direction_feature_mining'
          ]:
              if item not in forbidden:
                  forbidden.append(item)
          authority_path.write_text(json.dumps(a, ensure_ascii=False, indent=2) + '\n')

          human_path = root / 'docs/research/TWO_WAVE_M0_AUTHORITY.md'
          h = human_path.read_text()
          section = '''\n\n## v0.7.0 counteroffensive: first semantic break localized; ridge infrastructure salvaged\n\nFrozen protocol: `docs/research/TWO_WAVE_SEMANTIC_BRIDGE_COUNTEROFFENSIVE_V0700_PROTOCOL.md`.  \nFormal workflow run: `34671433841`.  \nFormal result commit: `4c0fc9366dd8e2ce6537f9c384c24d90f2d2f920`.  \nResult: `experiments/two_wave_semantic_bridge_counteroffensive_v0700/RESULT.json`.  \nResult card: `experiments/two_wave_semantic_bridge_counteroffensive_v0700/RESULT_CARD.md`.\n\nThe counteroffensive deliberately preserves downstream historical results until they are transplanted and retested. On the 11 independently confirmed human-positive cases with complete anchors, raw observed-turn support is `11/11`; a single common TCSS/ridge scale supports all five human cells in `10/11`, well above the frozen `8/11` salvage threshold. The nearest compatible ridge-node distance has median `0` bars at every ordinal.\n\nThe first major semantic collapse occurs at exact five-ridge tuple objectization: only `3/11` cases have a human-compatible exact-ridge five-tuple, and `7` cases are L1-positive but L2-negative. By contrast there is no further L2-to-L3 loss: all three compatible exact tuples also have causal tuple births by cutoff.\n\nFormal verdict: **`v0700_ridge_infrastructure_salvage_supported_exact_tuple_objectization_breaks_semantic_bridge`**.\n\nTherefore the project is not reset to zero. Data/clock/replay/governance are retained unchanged; TCSS extrema and ridge lineage are retained as support infrastructure. The exact-consecutive-five-ridge-tuple is removed as semantic-parent authority and must be reconstructed. Tuple-birth timing, raw projection/publication, same-scale qualification, and D1/v0.6.25 direction are not declared false; they are historical components awaiting transplantation tests after the parent object is repaired.\n\nThe next authorized step is v0.7.1 ridge-supported semantic parent objectization reconstruction. `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`.\n'''
          if '## v0.7.0 counteroffensive: first semantic break localized' not in h:
              h += section
          human_path.write_text(h)

          ledger_path = root / 'docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md'
          l = ledger_path.read_text()
          ls = '''\n\n## v0.7.0 counteroffensive salvage status\n\n- Direction work is not invalidated; it is upstream-blocked pending transplantation.\n- TCSS/ridge support is salvaged (`10/11` human-positive anchored cases).\n- Exact five-ridge tuple objectization fails the salvage threshold (`3/11`) and is the first localized semantic break.\n- Tuple-birth timing is not the first break (`L2→L3` loss `0`).\n- D1/v0.6.25 remain historical direction components, not winners and not active authority, until a repaired parent object reaches the direction transplantation stage.\n'''
          if '## v0.7.0 counteroffensive salvage status' not in l:
              l += ls
          ledger_path.write_text(l)

          index_path = root / 'docs/INDEX.md'
          idx = index_path.read_text()
          isec = '''\n\n### v0.7.0 semantic-bridge counteroffensive — complete\n\n- Protocol: `research/TWO_WAVE_SEMANTIC_BRIDGE_COUNTEROFFENSIVE_V0700_PROTOCOL.md`\n- Result: `../experiments/two_wave_semantic_bridge_counteroffensive_v0700/RESULT.json`\n- Result card: `../experiments/two_wave_semantic_bridge_counteroffensive_v0700/RESULT_CARD.md`\n- Adjudication: `../experiments/two_wave_semantic_bridge_counteroffensive_v0700/ADJUDICATION.json`\n- Verdict: `v0700_ridge_infrastructure_salvage_supported_exact_tuple_objectization_breaks_semantic_bridge`.\n- Salvage: ridge infrastructure retained; exact five-ridge tuple objectization is the first reconstruction point; downstream components await transplantation tests rather than being discarded.\n- Next: v0.7.1 ridge-supported semantic parent objectization reconstruction.\n'''
          if '### v0.7.0 semantic-bridge counteroffensive — complete' not in idx:
              idx += isec
          index_path.write_text(idx)

          readme_path = root / 'README.md'
          r = readme_path.read_text()
          marker = 'Current global stage is therefore **ordinal-0 predecessor-support / first-valid-publication lineage audit required**.'
          if marker in r:
              old_start = r.index(marker)
              old_end = r.find('\n\n', old_start)
              if old_end == -1:
                  old_end = len(r)
              new = '''v0.7.0 has now opened the counteroffensive from the earliest independently unsupported semantic bridge. The result salvages the causal TCSS extrema/ridge infrastructure: `10/11` independently confirmed anchored parents are representable by five correctly phased ridge nodes at one common scale. But only `3/11` become an exact consecutive five-ridge tuple, with `7` cases lost exactly at the L1→L2 objectization step. There is no further loss from compatible exact tuple to causal tuple birth.\n\nCurrent global stage is therefore **v0.7.1 ridge-supported semantic parent objectization reconstruction required**. Historical v0.6.x downstream components are not blanket-rejected: raw projection/publication, same-scale qualification, and direction logic are retained as components awaiting transplantation and retest after the parent object is repaired. Exact-ridge five-tuple objectization is no longer semantic-parent authority. `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`.'''
              r = r[:old_start] + new + r[old_end:]
          elif 'v0.7.0 has now opened the counteroffensive' not in r:
              r += '\n\n' + '''v0.7.0 has now opened the counteroffensive. Ridge infrastructure is salvaged (`10/11`), while exact consecutive five-ridge tuple objectization is the first localized semantic break (`3/11`). Downstream v0.6.x components are retained for transplantation retests, not blanket-rejected. Next: v0.7.1 ridge-supported semantic parent objectization reconstruction.\n'''
          readme_path.write_text(r)
          PY
      - name: Commit v0700 governance closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_m0_authority.json docs/research/TWO_WAVE_M0_AUTHORITY.md docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md docs/INDEX.md README.md
          git commit -m "Close v0700 counteroffensive governance [skip ci]"
          git push origin HEAD:research/two-wave-semantic-bridge-counteroffensive-v0700
