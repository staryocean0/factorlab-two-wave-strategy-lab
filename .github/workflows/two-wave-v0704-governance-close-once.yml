name: two-wave-v0704-governance-close-once

on:
  push:
    branches:
      - research/two-wave-f3-lifecycle-object-v0704

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Synchronize v0704 governance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          result = json.loads((root / 'experiments/two_wave_f3_prefix_causal_lifecycle_v0704/RESULT.json').read_text())
          authority_path = root / 'experiments/two_wave_m0_authority.json'
          a = json.loads(authority_path.read_text())

          a['schema'] = 'two_wave_m0_authority@1.29'
          a['global_status'] = 'v0704_f3_prefix_causal_lifecycle_representation_supported_provisional_publication_transplant_next'

          parent = a['component_authority']['parent_identity']
          parent['status'] = 'f3_prefix_causal_lifecycle_development_representation_supported_provisional_publication_next'
          parent['active_semantic_parent_authority'] = None
          parent['v0704_static_f3_support_cases'] = 8
          parent['v0704_lifecycle_live_support_cases'] = 8
          parent['v0704_c1_certified_support_cases'] = 7
          parent['v0704_live_unresolved_support_cases'] = 1
          parent['v0704_hard_invariant_violation_count'] = 0

          pub = a['component_authority']['raw_identity_publication']
          pub['status'] = 'historical_principles_queued_for_provisional_f3_lifecycle_publication_transplant'

          ss = a['component_authority']['same_scale_semantics']
          ss['status'] = 'historical_component_awaiting_lifecycle_publication_then_semantic_transplant_retest'

          q = a['component_authority']['qualification_policy']
          q['status'] = 'legacy_object_development_champion_awaiting_lifecycle_publication_transplant_before_retest'
          q['development_champion'] = True
          q['independent_reference_calibrated'] = False

          d = a['component_authority']['parent_direction']
          d['status'] = 'historical_components_awaiting_lifecycle_publication_and_qualification_retests'
          d['winner'] = None

          a['f3_prefix_causal_lifecycle'] = {
              'v0704': {
                  'status': 'supported_development_representation_not_active_morphology_authority',
                  'protocol': 'docs/research/TWO_WAVE_F3_PREFIX_CAUSAL_LIFECYCLE_V0704_PROTOCOL.md',
                  'protocol_freeze_commit': '3c0ae26d3453d8d0c5563be6ad58e7ea8c463ee0',
                  'formal_workflow_run': 34681831280,
                  'formal_result_commit': '96e528680b42e42b1951b9b656a9ed790c51073d',
                  'result': 'experiments/two_wave_f3_prefix_causal_lifecycle_v0704/RESULT.json',
                  'result_card': 'experiments/two_wave_f3_prefix_causal_lifecycle_v0704/RESULT_CARD.md',
                  'adjudication': 'experiments/two_wave_f3_prefix_causal_lifecycle_v0704/ADJUDICATION.json',
                  'static_f3_support_cases': 8,
                  'lifecycle_live_support_cases': 8,
                  'c1_certified_support_cases': 7,
                  'live_unresolved_support_cases': 1,
                  'hard_invariant_violation_count': 0,
                  'observed_object_count': 1543,
                  'certified_object_count': 1478,
                  'unresolved_object_count_at_cutoff_total': 65,
                  'objects_with_dormant_transition': 0,
                  'objects_with_reobserved_transition': 0,
                  'observation_to_certification_delay_median_bars': 0.0,
                  'observation_to_certification_delay_max_bars': 22.0,
                  'primary_category': result['primary_category'],
                  'future_event_information_used': False,
                  'threshold_fitting_performed': False,
                  'qualification_or_direction_evaluated': False,
                  'morphology_acceptance_changed': False,
                  'trade_authority_changed': False,
                  'production_authority_changed': False
              }
          }
          a['counteroffensive_current_breakpoint'] = 'f3_lifecycle_supported_provisional_publication_transplant_next'
          a['next_authorized_step'] = (
              'freeze a provisional lifecycle publication transplant: attach the v0.6.4 sequential raw-projection principle to the first observed lifecycle event, apply v0.6.5 first-valid immutable publication without rewriting lifecycle object identity, preserve observed-live-unresolved versus certified status, require later certification to append status/evidence only and never rewrite the first published raw identity, quantify projection validity/later confirmations/would-be rewrites by lifecycle status, and keep qualification/direction calibration blocked until publication semantics are adjudicated'
          )
          a['no_current_direction_challenger_authorized'] = True
          forbidden = a.setdefault('forbidden_next_shortcuts', [])
          for item in [
              'treat_v0704_observed_as_equivalent_to_c1_certified',
              'backdate_publication_or_status_using_later_c1_certification',
              'fit_waiting_period_to_drop_live_unresolved_objects',
              'rewrite_first_published_raw_identity_when_lifecycle_status_changes',
              'advance_to_qualification_or_direction_calibration_before_lifecycle_publication_adjudication'
          ]:
              if item not in forbidden:
                  forbidden.append(item)
          authority_path.write_text(json.dumps(a, ensure_ascii=False, indent=2) + '\n')

          human_path = root / 'docs/research/TWO_WAVE_M0_AUTHORITY.md'
          h = human_path.read_text()
          sec = '''\n\n## v0.7.4: F3 prefix-causal lifecycle representation — supported\n\nFrozen protocol: `docs/research/TWO_WAVE_F3_PREFIX_CAUSAL_LIFECYCLE_V0704_PROTOCOL.md`.  \nProtocol freeze commit: `3c0ae26d3453d8d0c5563be6ad58e7ea8c463ee0`.  \nFormal workflow run: `34681831280`.  \nFormal result commit: `96e528680b42e42b1951b9b656a9ed790c51073d`.  \nResult: `experiments/two_wave_f3_prefix_causal_lifecycle_v0704/RESULT.json`.  \nResult card: `experiments/two_wave_f3_prefix_causal_lifecycle_v0704/RESULT_CARD.md`.  \nAdjudication: `experiments/two_wave_f3_prefix_causal_lifecycle_v0704/ADJUDICATION.json`.\n\nThe append-only lifecycle reproduces static F3 support at `8/11` and C1-certified support at `7/11`, while lifecycle-live support remains `8/11`. The one permanent-certificate gap is represented as live unresolved rather than falsely certified. All hard causal/append-only invariants pass with zero violations. Across the 11 frozen windows, 1543 F3 objects are observed, 1478 later satisfy C1, and 65 remain unresolved at cutoff; no dormant or reobserved transitions occur in this Development universe.\n\nFormal verdict: **`v0704_f3_prefix_causal_lifecycle_representation_supported`**. This is a supported Development representation, not active morphology authority. The next authorized stage is provisional lifecycle publication transplantation using the retained v0.6.4/v0.6.5 principles. Qualification and direction remain blocked. `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`.\n'''
          if '## v0.7.4: F3 prefix-causal lifecycle representation' not in h:
              h += sec
          human_path.write_text(h)

          ledger = root / 'docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md'
          l = ledger.read_text()
          sec2 = '''\n\n## v0.7.4 prefix-causal lifecycle representation\n\n- Upstream parent-event lifecycle evidence only; no direction challenger or reference direction scoring was run.\n- Lifecycle-live F3 preserves `8/11` semantic support while terminal C1 certification remains `7/11`; the eighth case is live unresolved, not future-certified.\n- Hard append-only/causal invariant violations are zero.\n- D1/v0.6.25 remain historical direction components awaiting lifecycle-aware publication and later qualification transplantation.\n'''
          if '## v0.7.4 prefix-causal lifecycle representation' not in l:
              l += sec2
          ledger.write_text(l)

          idx_path = root / 'docs/INDEX.md'
          idx = idx_path.read_text()
          sec3 = '''\n\n### v0.7.4 F3 prefix-causal lifecycle reconstruction — complete\n\n- Protocol: `research/TWO_WAVE_F3_PREFIX_CAUSAL_LIFECYCLE_V0704_PROTOCOL.md`\n- Result: `../experiments/two_wave_f3_prefix_causal_lifecycle_v0704/RESULT.json`\n- Result card: `../experiments/two_wave_f3_prefix_causal_lifecycle_v0704/RESULT_CARD.md`\n- Adjudication: `../experiments/two_wave_f3_prefix_causal_lifecycle_v0704/ADJUDICATION.json`\n- Verdict: `v0704_f3_prefix_causal_lifecycle_representation_supported` (`8/11` live, `7/11` certified, zero hard-invariant violations).\n- Next: provisional lifecycle raw-projection / immutable-publication transplant; qualification/direction remain blocked.\n'''
          if '### v0.7.4 F3 prefix-causal lifecycle reconstruction — complete' not in idx:
              idx += sec3
          idx_path.write_text(idx)

          readme = root / 'README.md'
          r = readme.read_text()
          tail = '''\n\nv0.7.4 resolves the v0.7.3 causal-event deadlock by separating first observation from terminal permanence. The prefix-causal append-only lifecycle keeps frozen F3 live support at `8/11` while C1 certification remains `7/11`; the single certificate-gap case stays live unresolved instead of using future death evidence. All hard lifecycle invariants pass with zero violations. Across the 11 frozen windows, 1543 objects are observed and 1478 certify; no dormant/reobserved transitions occur. Formal verdict: **`v0704_f3_prefix_causal_lifecycle_representation_supported`**. The next stage is lifecycle-aware provisional raw projection / immutable publication; qualification and direction remain blocked.\n'''
          if 'v0.7.4 resolves the v0.7.3 causal-event deadlock' not in r:
              r += tail
          readme.write_text(r)
          PY
      - name: Commit v0704 governance closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_m0_authority.json docs/research/TWO_WAVE_M0_AUTHORITY.md docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md docs/INDEX.md README.md
          if git diff --cached --quiet; then
            echo "No governance changes"
            exit 0
          fi
          git commit -m "Close v0704 F3 lifecycle governance [skip ci]"
          git push origin HEAD:research/two-wave-f3-lifecycle-object-v0704
