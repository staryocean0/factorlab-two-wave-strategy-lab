name: two-wave-one-bar-duration-repair-v0620-once

on:
  push:
    branches:
      - research/two-wave-one-bar-duration-repair-v0620
    paths-ignore:
      - experiments/two_wave_one_bar_duration_repair_v0620/**

permissions:
  actions: read
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Download frozen v0618 row artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v0618-5m_offset_*
          path: tmp/v0618_inputs
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: 34423674192
      - name: Apply frozen v0620 promotion gate
        run: >-
          python scripts/evaluate_two_wave_one_bar_duration_repair_v0620.py
          --input tmp/v0618_inputs
          --output experiments/two_wave_one_bar_duration_repair_v0620
      - uses: actions/upload-artifact@v4
        with:
          name: v0620-final-result
          path: experiments/two_wave_one_bar_duration_repair_v0620/
          retention-days: 30
      - name: Commit formal result bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_one_bar_duration_repair_v0620
          git commit -m "Record formal v0620 one-bar duration repair result"
          git push
