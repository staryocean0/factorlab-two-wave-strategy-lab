name: two-wave-characteristic-scale-v051-fast
on:
  push:
    branches: ['codex/two-wave-phase1-20260905']
    paths:
      - 'src/factor_lab/visual_structure/two_wave/characteristic_scale_v051.py'
      - 'src/factor_lab/visual_structure/two_wave/characteristic_scale_v051_fast.py'
      - 'src/factor_lab/visual_structure/two_wave/geometry.py'
      - 'tests/unit/test_two_wave_characteristic_scale_v051.py'
      - 'tests/unit/test_two_wave_characteristic_scale_v051_fast.py'
      - 'scripts/run_two_wave_characteristic_scale_v051.py'
      - 'scripts/run_two_wave_characteristic_scale_v051_fast.py'
      - 'docs/research/two_wave_characteristic_scale_protocol_v051.md'
      - '.github/workflows/two-wave-characteristic-scale-v051-fast.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: two-wave-characteristic-scale-v051-fast-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  characteristic-scale-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e . editables==0.6
      - name: Validate bounded source package and frozen development data
        run: |
          mkdir -p v051_fast_proof/source
          python scripts/validate_theme_package.py | tee v051_fast_proof/package_validation.json
          git rev-parse HEAD > v051_fast_proof/commit.txt
      - name: Full regression and frozen-vs-fast equivalence gates
        run: python -m pytest -q --junitxml=v051_fast_proof/tests.xml | tee v051_fast_proof/tests.log
      - name: Run frozen characteristic-scale experiment through fast wrapper
        run: |
          python scripts/run_two_wave_characteristic_scale_v051_fast.py --output cloud_results/two_wave_characteristic_scale_v051_fast | tee v051_fast_proof/research.log
          git diff --exit-code -- data src tests scripts docs/research pyproject.toml
      - name: Retain exact implementation, hashes and environment
        if: always()
        run: |
          python -m pip freeze > v051_fast_proof/environment.txt
          cp src/factor_lab/visual_structure/two_wave/characteristic_scale_v051.py v051_fast_proof/source/
          cp src/factor_lab/visual_structure/two_wave/characteristic_scale_v051_fast.py v051_fast_proof/source/
          cp src/factor_lab/visual_structure/two_wave/geometry.py v051_fast_proof/source/
          cp tests/unit/test_two_wave_characteristic_scale_v051.py v051_fast_proof/source/
          cp tests/unit/test_two_wave_characteristic_scale_v051_fast.py v051_fast_proof/source/
          cp scripts/run_two_wave_characteristic_scale_v051.py v051_fast_proof/source/
          cp scripts/run_two_wave_characteristic_scale_v051_fast.py v051_fast_proof/source/
          cp docs/research/two_wave_characteristic_scale_protocol_v051.md v051_fast_proof/source/
          sha256sum v051_fast_proof/source/* > v051_fast_proof/source_sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-wave-characteristic-scale-v051-fast-${{ github.sha }}
          path: |
            cloud_results/two_wave_characteristic_scale_v051_fast/
            v051_fast_proof/
          retention-days: 30
          if-no-files-found: error
