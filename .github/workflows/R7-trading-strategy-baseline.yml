name: R7-trading-strategy-baseline

on:
  push:
    branches:
      - codex/two-wave-phase1-20260905
    paths:
      - '.github/workflows/R7-trading-strategy-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-R7-trading-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded dependencies
        run: python -m pip install 'numpy>=2.0,<2.6' 'pandas>=2.3,<3' 'pyarrow>=19,<20' 'pytest>=8.3,<9'
      - name: Verify frozen strategy artifacts and source identities
        run: |
          test "$(git hash-object docs/research/R7_trading_strategy_baseline_preanalysis_20260916.md)" = "6a7ac54319631a1be866fda39b16a2430d04fcee"
          test "$(git hash-object docs/governance/R7_trading_strategy_baseline_protocol_v1.json)" = "b33cc7552bdacdc11af1333ba9d8473c2a655c99"
          test "$(git hash-object scripts/run_R7_trading_strategy_baseline.py)" = "6c9a5f6952dcec13d270808939e5e9365e6668de"
          test "$(git hash-object tests/unit/test_R7_trading_strategy_baseline.py)" = "ae43bda7ef7f29caf1f79cde1d0bf2ad1f0cf0da"
          test "$(git hash-object scripts/run_R7_native_1m_rejected_excursion.py)" = "e42ba3a260b2ed8c5fc3c6be548e73f5245b8e30"
          test "$(git hash-object docs/governance/R7_trading_strategy_baseline_execution_freeze_v1.json)" = "7d2a33894034176a4cdc4fce028df6d89534d358"
          python - <<'PY'
          import hashlib, pandas as pd
          targets={
            'data/development/1m_official.parquet':('755217afce9dec383e48cd46d591402fa90dc50897abeb3dc7097c9a18a109d4',350561),
            'data/development/5m_offset_0.parquet':('bea21fa9dd9532e21605511e07561b33d5569f86f69f5a487507531593b14c48',70114),
          }
          for p,(expected_sha,expected_rows) in targets.items():
              h=hashlib.sha256(open(p,'rb').read()).hexdigest()
              assert h==expected_sha,(p,h)
              x=pd.read_parquet(p,columns=['symbol','trading_day'])
              assert len(x)==expected_rows,(p,len(x))
              assert set(x['symbol'].astype(str))=={'000852.SH'}
              assert str(x['trading_day'].astype(str).max()) <= '2020-12-31'
          print('frozen R7 trading strategy identities verified')
          PY
      - name: Run frozen strategy synthetic tests
        run: python -m pytest -q tests/unit/test_R7_trading_strategy_baseline.py
      - name: Execute frozen R7 trading strategy baseline
        run: python scripts/run_R7_trading_strategy_baseline.py --output /tmp/R7_trading_strategy_baseline_receipt_v1.json
      - name: Verify strategy authority boundaries and complete metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/R7_trading_strategy_baseline_receipt_v1.json').read_text())
          assert x['identity']=='R7_trading_strategy_baseline_v1'
          assert x['BLACKBOX_read'] is False
          assert x['post_2020_rows_read'] is False
          assert x['fresh_OOS_claim'] is False
          assert x['actual_IM_execution_cost_claim'] is False
          assert x['paper_trading_authority'] is False
          assert x['production_authority'] is False
          assert x['registry_mutation'] is False
          assert x['coefficient_policies']['expanding_audit']['all_history_max_day_strictly_before_eval_day'] is True
          assert x['execution']['overnight_exposure'] is False
          for policy in ('legacy_comparator','OLD_BASELINE'):
              for panel in ('0bps','1bps','2bps','5bps'):
                  m=x[policy]['cost_panel'][panel]
                  for k in ('total_return','annualized_return','annualized_volatility','max_drawdown','average_daily_turnover','annualized_turnover','average_abs_exposure'):
                      assert m[k] is not None
                  assert set(m['year_total_return'])=={'2019','2020'}
          print(x['adjudication'])
          print(json.dumps(x['OLD_BASELINE']['cost_panel']['2bps'],indent=2))
          PY
      - name: Upload frozen strategy receipt
        uses: actions/upload-artifact@v4
        with:
          name: R7-trading-strategy-baseline-receipt
          path: /tmp/R7_trading_strategy_baseline_receipt_v1.json
          if-no-files-found: error
