name: two-wave-confirmation-ablation-v043
on:
  push:
    branches: ['codex/two-wave-phase1-20260905']
    paths:
      - 'src/factor_lab/visual_structure/two_wave/same_scale_v043.py'
      - 'tests/unit/test_two_wave_confirmation_v043.py'
      - 'scripts/run_two_wave_confirmation_ablation.py'
      - 'docs/research/two_wave_confirmation_ablation_protocol_v043.md'
      - '.github/workflows/two-wave-confirmation-ablation.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: two-wave-confirmation-v043-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  confirmation-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e . editables==0.6
      - name: Validate immutable source package and original data
        run: |
          mkdir -p v043_proof/source
          python scripts/validate_theme_package.py | tee v043_proof/package_validation.json
          git rev-parse HEAD > v043_proof/commit.txt
      - name: Full regression tests
        run: python -m pytest -q --junitxml=v043_proof/tests.xml | tee v043_proof/tests.log
      - name: Run confirmation-kernel ablation on the six frozen development views
        run: |
          python scripts/run_two_wave_confirmation_ablation.py --output cloud_results/two_wave_confirmation_v043 | tee v043_proof/research.log
          git diff --exit-code -- data src tests scripts docs/research pyproject.toml
      - name: Retain exact implementation and environment
        if: always()
        run: |
          python -m pip freeze > v043_proof/environment.txt
          cp src/factor_lab/visual_structure/two_wave/same_scale_v043.py v043_proof/source/
          cp tests/unit/test_two_wave_confirmation_v043.py scripts/run_two_wave_confirmation_ablation.py docs/research/two_wave_confirmation_ablation_protocol_v043.md v043_proof/source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-wave-confirmation-v043-${{ github.sha }}
          path: |
            cloud_results/two_wave_confirmation_v043/
            v043_proof/
          retention-days: 30
          if-no-files-found: error
