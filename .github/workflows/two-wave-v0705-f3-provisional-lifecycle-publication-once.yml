name: two-wave-v0705-f3-provisional-lifecycle-publication-once

on:
  push:
    branches:
      - research/two-wave-f3-lifecycle-publication-v0705
    paths-ignore:
      - experiments/two_wave_f3_provisional_lifecycle_publication_v0705/RESULT.json

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Run frozen v0.7.5 F3 provisional lifecycle publication audit
        run: python scripts/run_two_wave_f3_provisional_lifecycle_publication_v0705.py
      - name: Commit aggregate result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_f3_provisional_lifecycle_publication_v0705/RESULT.json
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "Record formal v0705 provisional lifecycle publication result [skip ci]"
          git push origin HEAD:research/two-wave-f3-lifecycle-publication-v0705
