name: two-wave-duration-geometry-decomposition-v0619-once

on:
  push:
    branches:
      - research/two-wave-duration-geometry-decomposition-v0619
    paths-ignore:
      - experiments/two_wave_duration_geometry_decomposition_v0619/**

permissions:
  actions: read
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Download frozen v0618 row artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: v0618-5m_offset_*
          path: tmp/v0618_inputs
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: 34423674192
      - name: Apply frozen v0619 decomposition
        run: >-
          python scripts/analyze_two_wave_duration_geometry_decomposition_v0619.py
          --input tmp/v0618_inputs
          --output experiments/two_wave_duration_geometry_decomposition_v0619
      - uses: actions/upload-artifact@v4
        with:
          name: v0619-final-result
          path: experiments/two_wave_duration_geometry_decomposition_v0619/
          retention-days: 30
      - name: Commit formal result bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_duration_geometry_decomposition_v0619
          git commit -m "Record formal v0619 duration decomposition result"
          git push
