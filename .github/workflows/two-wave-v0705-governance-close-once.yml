name: two-wave-v0705-governance-close-once

on:
  push:
    branches:
      - research/two-wave-f3-lifecycle-publication-v0705
    paths:
      - .github/workflows/two-wave-v0705-governance-close-once.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Synchronize v0705 governance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          result_path = root / 'experiments/two_wave_f3_provisional_lifecycle_publication_v0705/RESULT.json'
          result = json.loads(result_path.read_text())
          authority_path = root / 'experiments/two_wave_m0_authority.json'
          a = json.loads(authority_path.read_text())

          verdict = result['primary_category']
          if verdict != 'v0705_f3_provisional_lifecycle_publication_transplant_supported':
              raise AssertionError(f'unexpected v0705 verdict: {verdict}')

          a['schema'] = 'two_wave_m0_authority@1.30'
          a['global_status'] = 'v0705_f3_provisional_lifecycle_publication_transplant_supported_qualification_transplant_precheck_next'

          parent = a['component_authority']['parent_identity']
          parent['status'] = 'f3_prefix_causal_lifecycle_and_provisional_publication_supported_qualification_transplant_next'
          parent['active_semantic_parent_authority'] = None
          parent['v0705_published_lifecycle_object_count'] = int(result['publication_summary']['published_lifecycle_object_count'])
          parent['v0705_published_raw_semantic_support_cases'] = int(result['semantic_continuity']['published_raw_semantic_support_cases'])
          parent['v0705_gap_same_object_provisional_raw_support_cases'] = int(result['semantic_continuity']['gap_same_object_provisional_raw_support_cases'])

          pub = a['component_authority']['raw_identity_publication']
          pub['status'] = 'v0705_provisional_f3_lifecycle_publication_transplant_supported_development_only'
          pub['v0705_published_lifecycle_object_count'] = int(result['publication_summary']['published_lifecycle_object_count'])
          pub['v0705_certified_object_publication_count'] = int(result['publication_summary']['certified_object_publication_count'])
          pub['v0705_final_unresolved_published_count'] = int(result['publication_summary']['final_unresolved_published_count'])
          pub['v0705_prior_invalid_projection_count'] = int(result['publication_summary']['prior_invalid_projection_count'])
          pub['v0705_later_valid_same_identity_count'] = int(result['publication_summary']['later_valid_same_identity_count'])
          pub['v0705_suppressed_would_be_rewrite_count'] = int(result['publication_summary']['later_valid_would_rewrite_suppressed_count'])
          pub['v0705_hard_invariant_violation_count'] = int(result['publication_summary']['hard_invariant_violation_count'])
          pub['v0705_published_raw_semantic_support_cases'] = int(result['semantic_continuity']['published_raw_semantic_support_cases'])

          ss = a['component_authority']['same_scale_semantics']
          ss['status'] = 'historical_component_lifecycle_publication_qualification_transplant_interface_semantic_precheck_next'

          q = a['component_authority']['qualification_policy']
          q['status'] = 'legacy_object_development_champion_lifecycle_publication_qualification_transplant_precheck_next'
          q['development_champion'] = True
          q['independent_reference_calibrated'] = False

          d = a['component_authority']['parent_direction']
          d['status'] = 'historical_components_awaiting_lifecycle_publication_qualification_transplant_adjudication'
          d['winner'] = None

          a['f3_provisional_lifecycle_publication'] = {
              'v0705': {
                  'status': 'supported_development_transplant_not_active_morphology_authority',
                  'protocol': 'docs/research/TWO_WAVE_F3_PROVISIONAL_LIFECYCLE_PUBLICATION_V0705_PROTOCOL.md',
                  'protocol_freeze_commit': '9652c7c2b0ba3761f1f326fd69d2d79039bd397d',
                  'formal_workflow_run': 34683112169,
                  'formal_result_commit': '5a7be41457adfdc304d215c06bd3ea8720ed16e7',
                  'result': 'experiments/two_wave_f3_provisional_lifecycle_publication_v0705/RESULT.json',
                  'result_card': 'experiments/two_wave_f3_provisional_lifecycle_publication_v0705/RESULT_CARD.md',
                  'adjudication': 'experiments/two_wave_f3_provisional_lifecycle_publication_v0705/ADJUDICATION.json',
                  'observed_lifecycle_object_count': int(result['required_upstream_replication']['observed_lifecycle_object_count']),
                  'published_lifecycle_object_count': int(result['publication_summary']['published_lifecycle_object_count']),
                  'certified_lifecycle_object_count': int(result['required_upstream_replication']['certified_lifecycle_object_count']),
                  'certified_object_publication_count': int(result['publication_summary']['certified_object_publication_count']),
                  'final_unresolved_object_count': int(result['publication_summary']['final_unresolved_object_count']),
                  'final_unresolved_published_count': int(result['publication_summary']['final_unresolved_published_count']),
                  'publication_delay_median_bars': result['publication_summary']['publication_delay_bars_from_observation']['median'],
                  'publication_delay_max_bars': result['publication_summary']['publication_delay_bars_from_observation']['max'],
                  'prior_invalid_projection_count': int(result['publication_summary']['prior_invalid_projection_count']),
                  'later_valid_same_identity_count': int(result['publication_summary']['later_valid_same_identity_count']),
                  'suppressed_would_be_rewrite_count': int(result['publication_summary']['later_valid_would_rewrite_suppressed_count']),
                  'hard_invariant_violation_count': int(result['publication_summary']['hard_invariant_violation_count']),
                  'published_raw_semantic_support_cases': int(result['semantic_continuity']['published_raw_semantic_support_cases']),
                  'per_ordinal_published_raw_cell_hit_cases': result['semantic_continuity']['per_ordinal_published_raw_cell_hit_cases'],
                  'gap_same_object_provisional_raw_support_cases': int(result['semantic_continuity']['gap_same_object_provisional_raw_support_cases']),
                  'primary_category': verdict,
                  'deterministic_replay_ok': bool(result['frozen_decision']['deterministic_replay_ok']),
                  'threshold_fitting_performed': False,
                  'qualification_or_direction_evaluated': False,
                  'morphology_acceptance_changed': False,
                  'trade_authority_changed': False,
                  'production_authority_changed': False
              }
          }

          a['counteroffensive_current_breakpoint'] = 'f3_lifecycle_publication_supported_qualification_transplant_precheck_next'
          a['next_authorized_step'] = (
              'freeze a lifecycle-publication qualification interface and semantic transplant precheck for historical v0.5.4/v0.6.18; '
              'feed immutable v0.7.5 phase, five raw occurrence bars, and publishing confirmation bar into the existing published-identity qualification interface with unchanged thresholds; '
              'first audit and eliminate implementation/interface exceptions without retuning qualification rules, preserve lifecycle object and publication identity, and stratify qualification mechanics by lifecycle status; '
              'only after the interface is clean may frozen human labels be used for semantic correspondence scoring; direction remains blocked until qualification transplantation is adjudicated'
          )
          a['no_current_direction_challenger_authorized'] = True
          a['current_parent_representation_status'] = 'F3_prefix_causal_lifecycle_and_provisional_publication_supported_as_development_representation_only'
          retention = a.setdefault('counteroffensive_component_retention', {})
          retention['raw_projection_v064_v065'] = 'v0705_transplant_supported_development_only_not_active_morphology_authority'
          retention['same_scale_v054_and_qualification_v0618'] = 'next_lifecycle_publication_semantic_transplant_precheck_not_declared_false'
          retention['direction_D1_v0625'] = 'awaiting_qualification_transplant_adjudication_not_declared_false'

          forbidden = a.setdefault('forbidden_next_shortcuts', [])
          for item in [
              'retune_v054_or_v0618_thresholds_during_lifecycle_qualification_transplant',
              'condition_qualification_on_future_c1_certification_or_final_lifecycle_state',
              'rewrite_v0705_lifecycle_object_or_publication_identity_during_qualification',
              'skip_qualification_interface_exception_audit_and_score_reference_semantics_directly',
              'treat_v0705_publication_support_as_active_morphology_authority',
              'reactivate_D1_or_v0625_before_qualification_transplant_adjudication'
          ]:
              if item not in forbidden:
                  forbidden.append(item)
          authority_path.write_text(json.dumps(a, ensure_ascii=False, indent=2) + '\n')

          human_path = root / 'docs/research/TWO_WAVE_M0_AUTHORITY.md'
          h = human_path.read_text()
          sec = '''\n\n## v0.7.5: provisional F3 lifecycle publication transplant — supported\n\nFrozen protocol: `docs/research/TWO_WAVE_F3_PROVISIONAL_LIFECYCLE_PUBLICATION_V0705_PROTOCOL.md`.  \nProtocol freeze commit: `9652c7c2b0ba3761f1f326fd69d2d79039bd397d`.  \nFormal workflow run: `34683112169`.  \nFormal result commit: `5a7be41457adfdc304d215c06bd3ea8720ed16e7`.  \nResult: `experiments/two_wave_f3_provisional_lifecycle_publication_v0705/RESULT.json`.  \nResult card: `experiments/two_wave_f3_provisional_lifecycle_publication_v0705/RESULT_CARD.md`.  \nAdjudication: `experiments/two_wave_f3_provisional_lifecycle_publication_v0705/ADJUDICATION.json`.\n\nAll 1543 observed lifecycle objects published at their first observation bar; all 1478 certified objects and all 65 final-unresolved objects were covered. Hard publication invariants were zero and deterministic replay passed. The first-valid append-only rule suppressed 239 later would-be raw-identity rewrites rather than altering the first publication. Published-raw semantic support remained `9/11` with per-ordinal cell hits `11/11, 11/11, 11/11, 11/11, 10/11`, and the single permanent-certificate gap case retained same-object provisional raw support. The formal verdict is **`v0705_f3_provisional_lifecycle_publication_transplant_supported`**.\n\nThis supports transplantation of the v0.6.4 sequential raw-projection and v0.6.5 immutable-publication principles into the F3 lifecycle. It does not grant active morphology authority. The next authorized stage is a separately frozen lifecycle-publication qualification interface and semantic transplant precheck for v0.5.4/v0.6.18. Interface exceptions must be resolved without threshold retuning before semantic correspondence is scored. Direction remains blocked. `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`.\n'''
          if '## v0.7.5: provisional F3 lifecycle publication transplant' not in h:
              h += sec
          human_path.write_text(h)

          ledger = root / 'docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md'
          l = ledger.read_text()
          sec2 = '''\n\n## v0.7.5 provisional lifecycle publication transplant\n\n- Upstream parent/publication evidence only; no direction challenger or direction scoring was run.\n- All 1543 observed F3 lifecycle objects obtained immutable raw publication at first observation; hard publication invariants were zero.\n- Raw semantic continuity remains `9/11`, and the unresolved eighth F3 semantic case has same-object provisional raw support.\n- v0.6.4 sequential projection and v0.6.5 first-valid immutable publication are retained as successfully transplanted Development principles.\n- D1/v0.6.25 remain historical direction components and cannot be reactivated until v0.5.4/v0.6.18 qualification transplantation is separately adjudicated.\n'''
          if '## v0.7.5 provisional lifecycle publication transplant' not in l:
              l += sec2
          ledger.write_text(l)

          idx_path = root / 'docs/INDEX.md'
          idx = idx_path.read_text()
          sec3 = '''\n\n### v0.7.5 F3 provisional lifecycle publication transplant — complete\n\n- Protocol: `research/TWO_WAVE_F3_PROVISIONAL_LIFECYCLE_PUBLICATION_V0705_PROTOCOL.md`\n- Result: `../experiments/two_wave_f3_provisional_lifecycle_publication_v0705/RESULT.json`\n- Result card: `../experiments/two_wave_f3_provisional_lifecycle_publication_v0705/RESULT_CARD.md`\n- Adjudication: `../experiments/two_wave_f3_provisional_lifecycle_publication_v0705/ADJUDICATION.json`\n- Verdict: `v0705_f3_provisional_lifecycle_publication_transplant_supported` (`1543/1543` published, `1478/1478` certified covered, raw semantic support `9/11`).\n- Next: frozen v0.5.4/v0.6.18 lifecycle-publication qualification interface + semantic transplant precheck; direction remains blocked.\n'''
          if '### v0.7.5 F3 provisional lifecycle publication transplant' not in idx:
              idx += sec3
          idx_path.write_text(idx)

          readme = root / 'README.md'
          r = readme.read_text()
          tail = '''\n\nv0.7.5 then transplanted the historical sequential raw-projection / first-valid immutable-publication principles onto the v0.7.4 prefix-causal F3 lifecycle. Every observed lifecycle object (`1543/1543`) published at first observation, including all `65/65` final-unresolved objects; all `1478/1478` certified objects were covered; hard publication invariants were zero. Later evidence produced 239 would-be raw-identity rewrites, all suppressed by the append-only rule. Published-raw semantic continuity remained `9/11`, including same-object provisional raw support for the single permanent-certificate gap case. The formal verdict is **`v0705_f3_provisional_lifecycle_publication_transplant_supported`**. The next stage is a frozen lifecycle-publication qualification interface and semantic transplant precheck for v0.5.4/v0.6.18; qualification thresholds may not be retuned and direction remains blocked.\n'''
          if 'v0.7.5 then transplanted the historical sequential raw-projection' not in r:
              r += tail
          readme.write_text(r)
          PY
      - name: Commit v0705 governance closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_m0_authority.json docs/research/TWO_WAVE_M0_AUTHORITY.md docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md docs/INDEX.md README.md
          if git diff --cached --quiet; then
            echo "No v0705 governance changes"
            exit 0
          fi
          git commit -m "Close v0705 provisional lifecycle publication governance [skip ci]"
          git push origin HEAD:research/two-wave-f3-lifecycle-publication-v0705
