name: two-wave-v0703-governance-close-once

on:
  push:
    branches:
      - research/two-wave-f3-causal-certificate-gap-v0703

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Synchronize v0703 governance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          result_path = root / 'experiments/two_wave_f3_causal_certificate_gap_v0703/RESULT.json'
          result = json.loads(result_path.read_text())
          authority_path = root / 'experiments/two_wave_m0_authority.json'
          a = json.loads(authority_path.read_text())

          verdict = result['primary_category']
          a['schema'] = 'two_wave_m0_authority@1.28'
          a['global_status'] = 'v0703_gap_requires_explicit_death_evidence_unavailable_at_cutoff_lifecycle_event_reconstruction_next'

          parent = a['component_authority']['parent_identity']
          parent['status'] = 'f3_static_development_reconstruction_supported_permanent_event_unresolved_due_causal_maturity'
          parent['active_semantic_parent_authority'] = None
          parent['v0703_static_f3_support_cases'] = int(result['required_replication']['static_f3_support_cases'])
          parent['v0703_c0_causal_support_cases'] = int(result['required_replication']['c0_causal_support_cases'])
          parent['v0703_c1_causal_support_cases'] = int(result['c1_minimal_explicit_death_certificate']['causal_support_cases'])
          parent['v0703_gap_case_count'] = int(result['required_replication']['static_supported_c0_unsupported_gap_cases'])
          parent['v0703_c1_restores_salvage_threshold'] = bool(result['frozen_decision']['c1_restores_salvage_threshold'])

          pub = a['component_authority']['raw_identity_publication']
          pub['status'] = 'historical_principle_positive_f3_transplant_evidence_blocked_by_event_lifecycle_resolution'

          ss = a['component_authority']['same_scale_semantics']
          ss['status'] = 'historical_component_awaiting_f3_semantic_transplant_retest_after_event_lifecycle_resolution'

          q = a['component_authority']['qualification_policy']
          q['status'] = 'legacy_object_development_champion_awaiting_f3_transplant_retest_after_event_lifecycle_resolution'
          q['development_champion'] = True
          q['independent_reference_calibrated'] = False

          d = a['component_authority']['parent_direction']
          d['status'] = 'historical_components_awaiting_f3_semantic_transplant_retest_after_parent_event_lifecycle_and_qualification_resolution'
          d['winner'] = None

          a['f3_causal_certificate_gap_attribution'] = {
              'v0703': {
                  'status': 'complete_gap_requires_explicit_death_evidence_unavailable_at_cutoff',
                  'protocol': 'docs/research/TWO_WAVE_F3_CAUSAL_CERTIFICATE_GAP_ATTRIBUTION_V0703_PROTOCOL.md',
                  'protocol_freeze_commit': 'de795faf95a8a47c4835ccae76f37c6d1c196821',
                  'formal_workflow_run': 34681005995,
                  'formal_result_commit': '68c978187b531ad6ac18c564a3214035be0dafa5',
                  'result': 'experiments/two_wave_f3_causal_certificate_gap_v0703/RESULT.json',
                  'result_card': 'experiments/two_wave_f3_causal_certificate_gap_v0703/RESULT_CARD.md',
                  'adjudication': 'experiments/two_wave_f3_causal_certificate_gap_v0703/ADJUDICATION.json',
                  'static_f3_support_cases': 8,
                  'c0_causal_support_cases': 7,
                  'c1_causal_support_cases': 7,
                  'c1_recovered_cases_vs_c0': 0,
                  'gap_case_count': 1,
                  'gap_human_compatible_static_realizations': 4,
                  'gap_missing_explicit_death_by_cutoff_count': 4,
                  'gap_proof_confirmation_after_cutoff_count': 4,
                  'every_gap_realization_missing_explicit_death': True,
                  'every_gap_realization_proof_after_cutoff': True,
                  'every_gap_realization_boundary_survival_unavailable': False,
                  'primary_category': verdict,
                  'future_ridge_lineage_used_for_blocker_attribution_only': True,
                  'future_ridge_survival_used_for_certificate': False,
                  'threshold_fitting_performed': False,
                  'qualification_or_direction_evaluated': False,
                  'morphology_acceptance_changed': False,
                  'trade_authority_changed': False,
                  'production_authority_changed': False
              }
          }
          a['counteroffensive_current_breakpoint'] = 'f3_permanent_event_requires_explicit_death_after_cutoff_lifecycle_event_reconstruction_next'
          a['next_authorized_step'] = (
              'freeze a causal object/event-layer reconstruction audit that preserves frozen F3 static semantics and the 8/11 Development continuity target while testing an append-only lifecycle representation such as observed -> certified or observed -> invalidated; '
              'observation creation must be prefix-causal and immutable, later state transitions must be evidence-timed and append-only, identity rewrites are forbidden, and qualification/direction calibration remains blocked until lifecycle semantics are separately frozen and audited'
          )
          a['no_current_direction_challenger_authorized'] = True
          forbidden = a.setdefault('forbidden_next_shortcuts', [])
          for item in [
              'treat_future_ridge_death_confirmation_as_available_at_cutoff',
              'waive_explicit_death_to_force_permanent_f3_support_to_8_of_11',
              'declare_static_f3_observation_a_permanent_event_without_lifecycle_state',
              'fit_lifecycle_timeout_or_invalidation_tolerance_from_the_11_positive_cases',
              'advance_to_qualification_or_direction_calibration_before_event_lifecycle_freeze'
          ]:
              if item not in forbidden:
                  forbidden.append(item)
          authority_path.write_text(json.dumps(a, ensure_ascii=False, indent=2) + '\n')

          human_path = root / 'docs/research/TWO_WAVE_M0_AUTHORITY.md'
          h = human_path.read_text()
          sec = '''\n\n## v0.7.3: F3 causal-certificate gap attribution — explicit death is unavailable at cutoff\n\nFrozen protocol: `docs/research/TWO_WAVE_F3_CAUSAL_CERTIFICATE_GAP_ATTRIBUTION_V0703_PROTOCOL.md`.  \nProtocol freeze commit: `de795faf95a8a47c4835ccae76f37c6d1c196821`.  \nFormal workflow run: `34681005995`.  \nFormal result commit: `68c978187b531ad6ac18c564a3214035be0dafa5`.  \nResult: `experiments/two_wave_f3_causal_certificate_gap_v0703/RESULT.json`.  \nResult card: `experiments/two_wave_f3_causal_certificate_gap_v0703/RESULT_CARD.md`.  \nAdjudication: `experiments/two_wave_f3_causal_certificate_gap_v0703/ADJUDICATION.json`.\n\nRequired replication held: static F3 `8/11`, C0 causal `7/11`, exactly one gap case. C1 relaxed only exact-coarse boundary-survival representation but still required explicit skipped-ridge death; it remained `7/11` and recovered zero cases. The one gap case has four human-compatible static realizations, and all four lack explicit death by cutoff while the corresponding proof appears only later. The formal verdict is **`v0703_gap_requires_explicit_death_evidence_unavailable_at_cutoff`**.\n\nThis rules out the narrow explanation that C0 failed merely because it demanded an exact coarse-level boundary representation. The next authorized stage is causal object/event-layer reconstruction, with an append-only lifecycle representation as the leading candidate. Qualification and direction remain blocked. `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`.\n'''
          if '## v0.7.3: F3 causal-certificate gap attribution' not in h:
              h += sec
          human_path.write_text(h)

          ledger = root / 'docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md'
          l = ledger.read_text()
          sec2 = '''\n\n## v0.7.3 causal-certificate gap attribution\n\n- Upstream parent-event evidence only; no direction challenger or reference direction scoring was run.\n- Static F3 remains `8/11`, while both C0 and C1 permanent causal certificates remain `7/11`.\n- The one-case loss is attributable to explicit RidgeDeath evidence being unavailable at cutoff, not to the exact-coarse boundary representation.\n- D1/v0.6.25 remain historical direction components awaiting later semantic transplantation after parent-event lifecycle and qualification are resolved.\n'''
          if '## v0.7.3 causal-certificate gap attribution' not in l:
              l += sec2
          ledger.write_text(l)

          idx_path = root / 'docs/INDEX.md'
          idx = idx_path.read_text()
          sec3 = '''\n\n### v0.7.3 F3 causal-certificate gap attribution — complete\n\n- Protocol: `research/TWO_WAVE_F3_CAUSAL_CERTIFICATE_GAP_ATTRIBUTION_V0703_PROTOCOL.md`\n- Result: `../experiments/two_wave_f3_causal_certificate_gap_v0703/RESULT.json`\n- Result card: `../experiments/two_wave_f3_causal_certificate_gap_v0703/RESULT_CARD.md`\n- Adjudication: `../experiments/two_wave_f3_causal_certificate_gap_v0703/ADJUDICATION.json`\n- Verdict: `v0703_gap_requires_explicit_death_evidence_unavailable_at_cutoff` (`8/11` static, `7/11` C0, `7/11` C1).\n- Next: causal object/event lifecycle reconstruction; qualification/direction remain blocked.\n'''
          if '### v0.7.3 F3 causal-certificate gap attribution — complete' not in idx:
              idx += sec3
          idx_path.write_text(idx)

          readme = root / 'README.md'
          r = readme.read_text()
          tail = '''\n\nv0.7.3 localized the remaining F3 event gap. The frozen static reconstruction still supports `8/11`; v0.7.2 C0 reproduces `7/11`; and the preregistered C1 boundary-survival relaxation also remains `7/11`, recovering no case. In the single gap case, all four human-compatible static F3 realizations lack explicit skipped-ridge death evidence at cutoff, and read-only full-lineage attribution shows the proof arrives only later. The formal verdict is **`v0703_gap_requires_explicit_death_evidence_unavailable_at_cutoff`**. The next stage therefore reconstructs the causal object/event layer rather than weakening the permanence certificate, with append-only lifecycle semantics (`observed -> certified/invalidated`) as the leading design. Qualification and direction calibration remain blocked.\n'''
          if 'v0.7.3 localized the remaining F3 event gap' not in r:
              r += tail
          readme.write_text(r)
          PY
      - name: Commit v0703 governance closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_m0_authority.json docs/research/TWO_WAVE_M0_AUTHORITY.md docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md docs/INDEX.md README.md
          git commit -m "Close v0703 F3 causal certificate gap governance [skip ci]"
          git push origin HEAD:research/two-wave-f3-causal-certificate-gap-v0703
