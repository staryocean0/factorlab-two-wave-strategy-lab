name: two-wave-d1-semantic-attribution-v055-main5m

on:
  push:
    branches: ['codex/two-wave-phase1-20260905']
    paths:
      - 'src/factor_lab/visual_structure/two_wave/d1_semantic_attribution_v055.py'
      - 'scripts/run_two_wave_d1_semantic_attribution_v055.py'
      - 'tests/unit/test_two_wave_d1_semantic_attribution_v055.py'
      - 'docs/research/two_wave_d1_semantic_attribution_protocol_v055.md'
      - '.github/workflows/two-wave-d1-semantic-attribution-v055-main5m.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  readonly-main5m-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e . editables==0.6
      - name: Validate bounded package and full regression
        run: |
          python scripts/validate_theme_package.py
          python -m pytest -q
      - name: Run frozen read-only D1 semantic attribution
        run: |
          mkdir -p v055_d1_attribution_proof/source
          git rev-parse HEAD > v055_d1_attribution_proof/commit.txt
          python scripts/run_two_wave_d1_semantic_attribution_v055.py | tee v055_d1_attribution_proof/research.log
          python -m pip freeze > v055_d1_attribution_proof/environment.txt
          cp src/factor_lab/visual_structure/two_wave/d1_semantic_attribution_v055.py v055_d1_attribution_proof/source/
          cp scripts/run_two_wave_d1_semantic_attribution_v055.py tests/unit/test_two_wave_d1_semantic_attribution_v055.py docs/research/two_wave_d1_semantic_attribution_protocol_v055.md v055_d1_attribution_proof/source/
          git diff --exit-code -- data src tests scripts docs/research pyproject.toml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-wave-d1-semantic-attribution-v055-main5m-${{ github.sha }}
          path: |
            cloud_results/two_wave_d1_semantic_attribution_v055/
            v055_d1_attribution_proof/
          retention-days: 30
          if-no-files-found: error
