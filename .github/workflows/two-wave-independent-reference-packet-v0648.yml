name: two-wave-v0648-blinded-reference-packet-once

on:
  push:
    branches:
      - research/two-wave-independent-reference-label-v0648
    paths-ignore:
      - experiments/two_wave_independent_reference_label_v0648/**

permissions:
  contents: write

jobs:
  build-packet:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Build frozen blinded annotation packet
        run: >-
          python scripts/build_two_wave_independent_reference_packet_v0648.py
          --output experiments/two_wave_independent_reference_label_v0648
      - uses: actions/upload-artifact@v4
        with:
          name: v0648-blinded-independent-reference-annotation-packet
          path: |
            experiments/two_wave_independent_reference_label_v0648/two_wave_v0648_blinded_annotation_packet.zip
            experiments/two_wave_independent_reference_label_v0648/PACKET_MANIFEST.json
            experiments/two_wave_independent_reference_label_v0648/SAMPLING_COMMITMENT.json
            experiments/two_wave_independent_reference_label_v0648/SCORING_BLOCKED.json
          retention-days: 90
          if-no-files-found: error
      - name: Commit packet audit metadata only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            experiments/two_wave_independent_reference_label_v0648/PACKET_MANIFEST.json \
            experiments/two_wave_independent_reference_label_v0648/SAMPLING_COMMITMENT.json \
            experiments/two_wave_independent_reference_label_v0648/SCORING_BLOCKED.json
          if git diff --cached --quiet; then
            echo "No audit metadata changes to commit"
            exit 0
          fi
          git commit -m "Record v0648 blinded reference packet audit metadata [skip ci]"
          git push origin HEAD:research/two-wave-independent-reference-label-v0648
