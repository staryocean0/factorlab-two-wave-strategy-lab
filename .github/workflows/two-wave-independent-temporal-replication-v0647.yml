name: two-wave-v0647-independent-temporal-replication-once

on:
  push:
    branches:
      - research/two-wave-independent-morphology-replication-v0647
    paths-ignore:
      - experiments/two_wave_independent_temporal_replication_v0647/**

permissions:
  contents: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q

  replication:
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Download frozen external CSI1000 temporal material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .runtime/v0647_external
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/staryocean0/factorlab-star50-filter-lab/ef7fedc0345c0e895b278a3f5448f85c132d5b98/data/cross_index_risk_gate_v1/1m/000852.SH/2024.parquet \
            -o .runtime/v0647_external/2024_1m.parquet
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/staryocean0/factorlab-star50-filter-lab/ef7fedc0345c0e895b278a3f5448f85c132d5b98/data/cross_index_risk_gate_v1/5m/000852.SH/2024.parquet \
            -o .runtime/v0647_external/2024_5m_offset_0.parquet
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/staryocean0/factorlab-star50-filter-lab/ef7fedc0345c0e895b278a3f5448f85c132d5b98/data/cross_index_risk_gate_v1/1m/000852.SH/2025.parquet \
            -o .runtime/v0647_external/2025_1m.parquet
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/staryocean0/factorlab-star50-filter-lab/ef7fedc0345c0e895b278a3f5448f85c132d5b98/data/cross_index_risk_gate_v1/5m/000852.SH/2025.parquet \
            -o .runtime/v0647_external/2025_5m_offset_0.parquet
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/staryocean0/factorlab-star50-filter-lab/4b93dd072e39af19201202e976afd6c63bf10112/data/cross_index_risk_gate_2026_v1/1m/000852.SH/2026.parquet \
            -o .runtime/v0647_external/2026_1m.parquet
      - name: Verify frozen external bytes before execution
        shell: bash
        run: |
          set -euo pipefail
          cd .runtime/v0647_external
          echo '52e1d078fefbb1232b07a8b64682f41654ee171d850c5fe5c928350aba9d6b25  2024_1m.parquet' | sha256sum -c -
          echo 'f9c536d99daa6aaf02d00efd7010316b528e54b5866dc8cf44d002d87f9c3667  2024_5m_offset_0.parquet' | sha256sum -c -
          echo 'aebbf7c7bedb78863455192d6efed7536f785c6558fcecd14b475e276e95e1e6  2025_1m.parquet' | sha256sum -c -
          echo '5fbecf49d76cd2560e7db5af280b60c012a440a6e69ba6b8306acbbbd4e49333  2025_5m_offset_0.parquet' | sha256sum -c -
          echo '60b2054d2055bef8010a9948a0589bc1c4b0bb18dd6f373a9366f97e689fdf87  2026_1m.parquet' | sha256sum -c -
      - name: Run frozen v0647 temporal replication
        run: >-
          python scripts/run_two_wave_independent_temporal_replication_v0647.py
          --external-root .runtime/v0647_external
          --output experiments/two_wave_independent_temporal_replication_v0647
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0647-independent-temporal-replication
          path: experiments/two_wave_independent_temporal_replication_v0647/
          retention-days: 90
      - name: Commit formal result bundle
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_independent_temporal_replication_v0647/
          if git diff --cached --quiet; then
            echo "No result changes to commit"
            exit 0
          fi
          git commit -m "Record formal v0647 temporal replication result [skip ci]"
          git push origin HEAD:research/two-wave-independent-morphology-replication-v0647
