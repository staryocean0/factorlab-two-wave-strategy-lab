name: two-wave-v0707-lifecycle-qualified-direction-once

on:
  push:
    branches:
      - research/two-wave-lifecycle-qualified-direction-v0707
    paths:
      - .github/workflows/two-wave-v0707-lifecycle-qualified-direction-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Run frozen v0.7.7 lifecycle-qualified direction transplant
        run: python scripts/run_two_wave_lifecycle_qualified_direction_v0707_formal.py
      - name: Commit aggregate v0707 result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_lifecycle_qualified_direction_v0707/RESULT.json
          if git diff --cached --quiet; then
            echo "No v0707 result change"
            exit 0
          fi
          git commit -m "Record formal v0707 lifecycle-qualified direction result [skip ci]"
          git push origin HEAD:research/two-wave-lifecycle-qualified-direction-v0707
