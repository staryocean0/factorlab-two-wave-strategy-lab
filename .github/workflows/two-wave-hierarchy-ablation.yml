name: two-wave-hierarchy-ablation-v044
on:
  push:
    branches: ['codex/two-wave-phase1-20260905']
    paths:
      - 'src/factor_lab/visual_structure/two_wave/same_scale_v044.py'
      - 'tests/unit/test_two_wave_hierarchy_v044.py'
      - 'scripts/run_two_wave_hierarchy_ablation.py'
      - 'docs/research/two_wave_hierarchy_protocol_v044.md'
      - '.github/workflows/two-wave-hierarchy-ablation.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: two-wave-hierarchy-v044-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  hierarchy-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e . editables==0.6
      - name: Validate immutable source package and original data
        run: |
          mkdir -p v044_proof/source
          python scripts/validate_theme_package.py | tee v044_proof/package_validation.json
          git rev-parse HEAD > v044_proof/commit.txt
      - name: Full regression tests
        run: python -m pytest -q --junitxml=v044_proof/tests.xml | tee v044_proof/tests.log
      - name: Run hierarchical candidate-construction ablation on six frozen development views
        run: |
          python scripts/run_two_wave_hierarchy_ablation.py --output cloud_results/two_wave_hierarchy_v044 | tee v044_proof/research.log
          git diff --exit-code -- data src tests scripts docs/research pyproject.toml
      - name: Retain exact implementation and environment
        if: always()
        run: |
          python -m pip freeze > v044_proof/environment.txt
          cp src/factor_lab/visual_structure/two_wave/same_scale_v044.py v044_proof/source/
          cp tests/unit/test_two_wave_hierarchy_v044.py scripts/run_two_wave_hierarchy_ablation.py docs/research/two_wave_hierarchy_protocol_v044.md v044_proof/source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-wave-hierarchy-v044-${{ github.sha }}
          path: |
            cloud_results/two_wave_hierarchy_v044/
            v044_proof/
          retention-days: 30
          if-no-files-found: error
