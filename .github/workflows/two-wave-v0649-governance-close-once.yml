name: two-wave-v0649-governance-close-once

on:
  push:
    branches:
      - research/two-wave-reference-conditioned-qualification-attribution-v0649

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Synchronize v0649 governance and root status
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          authority_path = root / 'experiments/two_wave_m0_authority.json'
          a = json.loads(authority_path.read_text())
          a['schema'] = 'two_wave_m0_authority@1.21'
          a['global_status'] = 'v0649_diffuse_or_fundamental_semantic_object_mismatch_parent_representation_audit_next'

          q = a['component_authority']['qualification_policy']
          q['status'] = 'development_champion_failed_independent_reference_calibration_no_gate_level_failure_family'
          q['development_champion'] = True
          q['independent_reference_calibrated'] = False

          a['reference_conditioned_qualification_attribution'] = {
              'v0649': {
                  'status': 'complete_no_strong_predeclared_failure_family',
                  'protocol': 'docs/research/TWO_WAVE_REFERENCE_CONDITIONED_QUALIFICATION_FAILURE_ATTRIBUTION_V0649_PROTOCOL.md',
                  'protocol_freeze_commit': '0ee879f8258ee514e5b4556d7286f2ce2d4a972f',
                  'formal_workflow_run': 34664379475,
                  'formal_result_commit': 'd3f4c3a2b97b6d517faed5fb4bbb54d2d95f46c8',
                  'result': 'experiments/two_wave_reference_conditioned_qualification_attribution_v0649/RESULT.json',
                  'result_card': 'experiments/two_wave_reference_conditioned_qualification_attribution_v0649/RESULT_CARD.md',
                  'adjudication': 'experiments/two_wave_reference_conditioned_qualification_attribution_v0649/ADJUDICATION.json',
                  'candidate_cases': 120,
                  'reference_no_candidates': 104,
                  'reference_yes_candidates': 16,
                  'strongly_supported_families': [],
                  'primary_attribution': 'diffuse_or_fundamental_semantic_object_mismatch',
                  'isolated_amplitude_unit_fraction_failure_rank': 0.75,
                  'amplitude_cutoff_authorized': False,
                  'publication_maturity_supported': False,
                  'fragment_parent_scale_supported': False,
                  'same_scale_imbalance_supported': False,
                  'path_noise_supported': False,
                  'identity_ambiguity_supported': False,
                  'threshold_fitting_performed': False,
                  'qualification_changed': False,
                  'direction_winner_changed': False,
                  'morphology_acceptance_changed': False,
                  'trade_authority_changed': False,
                  'production_authority_changed': False,
                  'verdict': 'v0649_diffuse_or_fundamental_semantic_object_mismatch'
              }
          }
          a['current_qualification_failure_attribution_status'] = 'v0649_complete_no_strong_existing_gate_family_semantic_object_mismatch'
          a['current_independent_reference_calibrated_qualification_authority'] = None
          a['next_authorized_step'] = (
              'freeze a read-only semantic-object / parent-representation audit using the frozen v0648 reference evidence; '
              'test whether algorithmic five-anchor identity, parent boundaries, and reference-visible parent object correspond; '
              'do not mine residual gates or fit amplitude/qualification thresholds on v0648 labels'
          )
          a['no_current_direction_challenger_authorized'] = True
          forbidden = a.setdefault('forbidden_next_shortcuts', [])
          for item in [
              'fit_amplitude_unit_fraction_cutoff_from_v0649',
              'restore_v0618_demoted_path_gates_from_v0649',
              'mine_residual_qualification_gates_from_the_104_v0648_reference_negative_candidates',
              'claim_fragment_parent_scale_as_primary_v0649_mechanism_from_amplitude_unit_fraction_alone',
              'resume_parent_direction_micro_feature_mining_before_semantic_object_parent_representation_audit'
          ]:
              if item not in forbidden:
                  forbidden.append(item)
          authority_path.write_text(json.dumps(a, ensure_ascii=False, indent=2) + '\n')

          human_path = root / 'docs/research/TWO_WAVE_M0_AUTHORITY.md'
          h = human_path.read_text()
          section = '''\n\n## v0.6.49: reference-conditioned qualification failure attribution — complete; no existing gate family explains the semantic failure\n\nFrozen protocol: `docs/research/TWO_WAVE_REFERENCE_CONDITIONED_QUALIFICATION_FAILURE_ATTRIBUTION_V0649_PROTOCOL.md`.  \nProtocol freeze commit: `0ee879f8258ee514e5b4556d7286f2ce2d4a972f`.  \nFormal workflow run: `34664379475`.  \nFormal result commit: `d3f4c3a2b97b6d517faed5fb4bbb54d2d95f46c8`.  \nResult: `experiments/two_wave_reference_conditioned_qualification_attribution_v0649/RESULT.json`.  \nResult card: `experiments/two_wave_reference_conditioned_qualification_attribution_v0649/RESULT_CARD.md`.  \nGovernance adjudication: `experiments/two_wave_reference_conditioned_qualification_attribution_v0649/ADJUDICATION.json`.\n\nThe audit compares the frozen `104` reference-negative versus `16` reference-positive v0.6.18 candidate cases without using annotator notes/confidence, D1/v0.6.25 predictions, future outcomes, or fitted thresholds. No predeclared failure family met the frozen strong-support rule:\n\n- publication maturity: unsupported (`confirmation_delay_bars` adjusted rank `0.5027`);\n- fragment/parent scale: unsupported as a family;\n- same-scale duration/amplitude imbalance: unsupported;\n- path noise / the v0.6.18-demoted path diagnostics: unsupported;\n- identity ambiguity: unsupported.\n\nThe strongest isolated clue is `amplitude_unit_fraction`: reference-no median `0.3137`, reference-yes median `0.4347`, direction-adjusted rank `0.75`. But the corroborating parent-span and anchor-excursion diagnostics are only `0.6226` and `0.5306`, so the frozen rule explicitly rejects a `fragment_parent_scale` mechanism claim and does not authorize an amplitude cutoff.\n\nFormal verdict: **`v0649_diffuse_or_fundamental_semantic_object_mismatch`**.\n\nInterpretation: v0.6.48's low candidate semantic precision is not cleanly attributable to one existing qualification diagnostic family. The next scientific breakpoint moves upstream to the object itself: whether the exact-ridge/published-five-anchor identity and its parent boundaries correspond to the independently annotated visible parent object. No new qualification rule, restored path veto, amplitude threshold, or direction challenger is authorized. Independently reference-calibrated qualification authority remains `none`; parent-direction winner remains unset; `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`.\n'''
          if '## v0.6.49: reference-conditioned qualification failure attribution' not in h:
              h += section
          human_path.write_text(h)

          ledger_path = root / 'docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md'
          l = ledger_path.read_text()
          ledger_section = '''\n\n## v0.6.49 upstream qualification attribution\n\n- This is **not a direction contribution**; it diagnoses the upstream qualification-semantic failure exposed by v0.6.48.\n- `104` reference-negative versus `16` reference-positive frozen candidate cases were compared under a pre-frozen read-only protocol.\n- No predeclared family (publication maturity, fragment scale, same-scale imbalance, path noise, identity ambiguity) met strong support.\n- Isolated clue: `amplitude_unit_fraction` adjusted rank `0.75`, but family corroboration failed; no cutoff or gate is authorized.\n- Verdict: `v0649_diffuse_or_fundamental_semantic_object_mismatch`.\n- Direction research remains blocked until the parent semantic object / representation mismatch is resolved.\n'''
          if '## v0.6.49 upstream qualification attribution' not in l:
              l += ledger_section
          ledger_path.write_text(l)

          index_path = root / 'docs/INDEX.md'
          idx = index_path.read_text()
          idx_section = '''\n\n### v0.6.49 reference-conditioned qualification failure attribution — complete\n\n- Protocol: `research/TWO_WAVE_REFERENCE_CONDITIONED_QUALIFICATION_FAILURE_ATTRIBUTION_V0649_PROTOCOL.md`\n- Result: `../experiments/two_wave_reference_conditioned_qualification_attribution_v0649/RESULT.json`\n- Result card: `../experiments/two_wave_reference_conditioned_qualification_attribution_v0649/RESULT_CARD.md`\n- Governance adjudication: `../experiments/two_wave_reference_conditioned_qualification_attribution_v0649/ADJUDICATION.json`\n- Verdict: `v0649_diffuse_or_fundamental_semantic_object_mismatch`; no existing gate family is strongly supported.\n- Next: separately freeze a read-only semantic-object / parent-representation audit.\n'''
          if '### v0.6.49 reference-conditioned qualification failure attribution — complete' not in idx:
              idx += idx_section
          index_path.write_text(idx)

          readme_path = root / 'README.md'
          r = readme_path.read_text()
          start = r.find('v0.6.48 has now executed the next authorized stage.')
          end_marker = 'Even a successful v0.6.48 Development-period calibration does not by itself grant global morphology acceptance; a separately frozen fresh held-out reference-label validation would still be required.'
          end = r.find(end_marker)
          if start != -1 and end != -1 and end >= start:
              end += len(end_marker)
              replacement = '''v0.6.48 completed the independently blinded reference-label calibration. The annotation layer passed its frozen agreement gates and all 16 first-pass disagreements were independently adjudicated, but the recognizer calibration failed decisively: only `16/120 = 13.33%` of hidden v0.6.18 candidate cases were independently confirmed as complete same-scale two-wave parents, and v0.6.25 parent-state exact agreement on those 16 confirmed candidates was only `5/16 = 31.25%`. The formal verdict is **`v0648_independent_reference_calibration_gates_not_all_pass`**. Therefore v0.6.18 remains only the Development-era qualification champion; independently reference-calibrated qualification authority is **none**.\n\nv0.6.49 then executed the frozen read-only reference-conditioned failure attribution over the same 120 candidates. No predeclared existing diagnostic family — publication maturity, fragment/parent scale, duration/amplitude imbalance, path noise, or identity ambiguity — met the frozen strong-support rule. `amplitude_unit_fraction` produced an isolated adjusted rank of `0.75`, but its family-level corroboration failed, so no amplitude cutoff or qualification gate is authorized. The formal verdict is **`v0649_diffuse_or_fundamental_semantic_object_mismatch`**.\n\nCurrent global stage is therefore **semantic-object / parent-representation audit required**. Parent-direction winner remains unset; `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`. The next authorized action is a separately frozen read-only audit of whether the algorithmic exact-ridge/published-five-anchor object and its parent boundaries correspond to the independently annotated visible parent object. Residual gate mining, v0.6.18 threshold fitting, restored path vetoes, amplitude cutoff fitting, and renewed direction micro-feature mining remain unauthorized.'''
              r = r[:start] + replacement + r[end:]
          readme_path.write_text(r)
          PY

      - name: Commit v0649 governance closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_m0_authority.json docs/research/TWO_WAVE_M0_AUTHORITY.md docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md docs/INDEX.md README.md
          git commit -m "Close v0649 semantic qualification attribution governance [skip ci]"
          git push origin HEAD:research/two-wave-reference-conditioned-qualification-attribution-v0649
