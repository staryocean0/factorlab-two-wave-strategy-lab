name: two-wave-multiscale-tcss-v050-poc
on:
  push:
    branches: ['codex/two-wave-phase1-20260905']
    paths:
      - 'src/factor_lab/visual_structure/two_wave/multiscale_v050.py'
      - 'tests/unit/test_two_wave_multiscale_v050.py'
      - 'scripts/run_two_wave_multiscale_tcss_poc.py'
      - 'scripts/run_two_wave_multiscale_tcss_poc_fast.py'
      - 'docs/research/two_wave_multiscale_pre_research_v050.md'
      - 'docs/research/two_wave_multiscale_poc_protocol_v050.md'
      - '.github/workflows/two-wave-multiscale-tcss-poc.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: two-wave-multiscale-tcss-v050-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  tcss-representation-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e . editables==0.6
      - name: Validate bounded source package and frozen development data
        run: |
          mkdir -p v050_tcss_proof/source
          python scripts/validate_theme_package.py | tee v050_tcss_proof/package_validation.json
          git rev-parse HEAD > v050_tcss_proof/commit.txt
      - name: Full regression and synthetic hard gates
        run: python -m pytest -q --junitxml=v050_tcss_proof/tests.xml | tee v050_tcss_proof/tests.log
      - name: Run TCSS representation POC on six frozen views
        run: |
          python scripts/run_two_wave_multiscale_tcss_poc_fast.py --output cloud_results/two_wave_multiscale_tcss_v050 | tee v050_tcss_proof/research.log
          git diff --exit-code -- data src tests scripts docs/research pyproject.toml
      - name: Retain exact implementation and environment
        if: always()
        run: |
          python -m pip freeze > v050_tcss_proof/environment.txt
          cp src/factor_lab/visual_structure/two_wave/multiscale_v050.py v050_tcss_proof/source/
          cp tests/unit/test_two_wave_multiscale_v050.py scripts/run_two_wave_multiscale_tcss_poc.py scripts/run_two_wave_multiscale_tcss_poc_fast.py docs/research/two_wave_multiscale_pre_research_v050.md docs/research/two_wave_multiscale_poc_protocol_v050.md v050_tcss_proof/source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-wave-multiscale-tcss-v050-${{ github.sha }}
          path: |
            cloud_results/two_wave_multiscale_tcss_v050/
            v050_tcss_proof/
          retention-days: 30
          if-no-files-found: error
