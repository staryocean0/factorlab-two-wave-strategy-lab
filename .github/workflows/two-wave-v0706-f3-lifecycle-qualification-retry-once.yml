name: two-wave-v0706-f3-lifecycle-qualification-retry-once

on:
  push:
    branches:
      - research/two-wave-f3-lifecycle-qualification-v0706
    paths:
      - .github/workflows/two-wave-v0706-f3-lifecycle-qualification-retry-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Run frozen v0.7.6 qualification transplant implementation retry
        run: python scripts/run_two_wave_f3_lifecycle_qualification_transplant_v0706_retry.py
      - name: Commit aggregate retry result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_f3_lifecycle_qualification_transplant_v0706/RESULT.json
          if git diff --cached --quiet; then
            echo "No v0706 retry result change"
            exit 0
          fi
          git commit -m "Record formal v0706 qualification implementation retry [skip ci]"
          git push origin HEAD:research/two-wave-f3-lifecycle-qualification-v0706
