name: broad-rmr-stage1-mature-scale-supply
on:
  push:
    branches: [codex/broad-reversal-authority-reset-20260908]
    paths:
      - 'scripts/select_broad_rmr_stage1_scale_by_mature_supply_v2.py'
      - 'docs/governance/reversal_mean_reversion_M0_scale_semantics_binding_v2.json'
      - '.github/workflows/broad-rmr-stage1-mature-scale-supply.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structural-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pandas pyarrow
      - name: Select from mature structural supply only
        run: python scripts/select_broad_rmr_stage1_scale_by_mature_supply_v2.py --output /tmp/mature_scale.json
      - name: Verify no price values/outcomes
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/mature_scale.json'))
          assert x['OHLC_or_price_values_read'] is False
          assert x['future_price_outcomes_read'] is False
          assert x['scale_relation']=='parent_L_finer_L_minus_2_one_octave'
          print('mature supply selection boundary preserved')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: broad-rmr-stage1-mature-scale-supply
          path: /tmp/mature_scale.json
          if-no-files-found: error
