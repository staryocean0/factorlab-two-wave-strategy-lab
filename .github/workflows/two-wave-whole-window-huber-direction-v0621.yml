name: two-wave-whole-window-huber-direction-v0621-once

on:
  push:
    branches:
      - research/two-wave-whole-window-huber-direction-v0621
    paths-ignore:
      - experiments/two_wave_whole_window_huber_direction_v0621/**

permissions:
  actions: read
  contents: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q

  replay:
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Download frozen v0618 identity artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34423674192
          pattern: v0618-5m_offset_*
          path: tmp/v0621_input
          merge-multiple: true
      - name: Replay D1 and whole-window Huber on frozen qualified identities
        run: >-
          python scripts/run_two_wave_whole_window_huber_direction_v0621.py
          --input tmp/v0621_input
          --output experiments/two_wave_whole_window_huber_direction_v0621
      - uses: actions/upload-artifact@v4
        with:
          name: v0621-whole-window-direction-result
          path: experiments/two_wave_whole_window_huber_direction_v0621/
          retention-days: 30
      - name: Commit formal v0621 result bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_whole_window_huber_direction_v0621
          git commit -m "Record formal v0621 whole-window direction result"
          git push
