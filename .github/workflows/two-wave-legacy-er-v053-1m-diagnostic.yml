name: two-wave-legacy-er-v053-1m-diagnostic
on:
  workflow_dispatch:
  push:
    branches: ['codex/two-wave-phase1-20260905']
    paths:
      - 'src/factor_lab/visual_structure/two_wave/legacy_er_v053.py'
      - 'tests/unit/test_two_wave_legacy_er_v053.py'
      - 'scripts/run_two_wave_legacy_er_v053.py'
      - 'docs/research/two_wave_legacy_er_protocol_v053.md'
      - '.github/workflows/two-wave-legacy-er-v053-1m-diagnostic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: two-wave-legacy-er-v053-1m-diagnostic-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  formal-1m-v053:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e . editables==0.6
      - name: Validate bounded package and frozen data
        run: |
          mkdir -p v053_1m_proof/source
          python scripts/validate_theme_package.py | tee v053_1m_proof/package_validation.json
          git rev-parse HEAD > v053_1m_proof/commit.txt
      - name: Run formal v0.5.3 1m causal diagnostic
        run: |
          python scripts/run_two_wave_legacy_er_v053.py \
            --views 1m_official \
            --skip-offset-stability \
            --output cloud_results/two_wave_legacy_er_v053_1m \
            | tee v053_1m_proof/research.log
          git diff --exit-code -- data src tests scripts docs/research pyproject.toml
      - name: Retain exact source and environment
        if: always()
        run: |
          python -m pip freeze > v053_1m_proof/environment.txt
          cp src/factor_lab/visual_structure/two_wave/legacy_er_v053.py v053_1m_proof/source/
          cp tests/unit/test_two_wave_legacy_er_v053.py scripts/run_two_wave_legacy_er_v053.py docs/research/two_wave_legacy_er_protocol_v053.md v053_1m_proof/source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-wave-legacy-er-v053-1m-${{ github.sha }}
          path: |
            cloud_results/two_wave_legacy_er_v053_1m/
            v053_1m_proof/
          retention-days: 30
          if-no-files-found: error
