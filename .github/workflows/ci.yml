name: bounded-theme-validation

# Quota unavailable: no push/PR/scheduled execution. This is a retained
# verification recipe, not a currently authorized scientific experiment.
on:
  workflow_dispatch:
    inputs:
      confirm_quota_and_authorization:
        description: "Explicitly confirm restored quota and authorization"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    if: ${{ inputs.confirm_quota_and_authorization && vars.TWO_WAVE_ACTIONS_ALLOWED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/verify_repository.py --report /tmp/two-wave-verification.json
