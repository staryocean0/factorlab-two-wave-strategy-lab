name: two-wave-five-minute-priority-audit
on:
  push:
    branches: ['codex/two-wave-phase1-20260905']
    paths:
      - 'src/factor_lab/visual_structure/two_wave/frequency_v03*.py'
      - 'scripts/run_two_wave_frequency_study*.py'
      - 'tests/unit/test_two_wave_frequency*'
      - '.github/workflows/two-wave-frequency-audit.yml'
permissions:
  contents: read
jobs:
  frequency-and-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e . editables==0.6
      - name: Validate unchanged original assets
        run: python scripts/validate_theme_package.py
      - name: Full regression suite with explicit test count
        run: python -m pytest -o addopts='' -q --junitxml=frequency_tests.xml
      - name: Re-run six-view C1 after graphical failure attribution
        run: python scripts/run_two_wave_frequency_study_c1.py --output cloud_results/two_wave_frequency_v031
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-wave-frequency-v031-${{ github.sha }}
          path: |
            cloud_results/two_wave_frequency_v031/
            frequency_tests.xml
          retention-days: 30
