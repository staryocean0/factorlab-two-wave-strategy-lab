name: broad-rmr-M1-R1-R2-outcomes

on:
  push:
    branches:
      - codex/broad-reversal-authority-reset-20260908
    paths:
      - 'scripts/run_broad_rmr_M1_R1_R2_outcomes.py'
      - 'tests/unit/test_broad_rmr_M1_R1_R2_outcomes.py'
      - 'docs/research/rmr_M1_R1_R2_outcome_preanalysis_20260908.md'
      - 'docs/governance/reversal_mean_reversion_M1_R1_R2_outcome_protocol_v1.json'
      - 'docs/governance/reversal_mean_reversion_M1_R1_R2_outcome_execution_freeze_v1.json'
      - '.github/workflows/broad-rmr-M1-R1-R2-outcomes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-M1-outcomes:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install pytest numpy pandas pyarrow scikit-learn
      - name: Verify frozen blob identities
        run: |
          test "$(git hash-object docs/governance/reversal_mean_reversion_M1_single_shock_event_adapter_v1.json)" = "f7f979a8afb2c07f41400e94c713f6714935544f"
          test "$(git hash-object docs/research/cloud_session_20260908_broad_rmr_M1_S0_event_supply_receipt_v1.json)" = "9e6f5f77b9d052f6706ab45d3bc285cdd19c4c65"
          test "$(git hash-object docs/research/rmr_M1_R1_R2_outcome_preanalysis_20260908.md)" = "bd6531677a0e2952777e688c27b9eb3eaf50a13b"
          test "$(git hash-object docs/governance/reversal_mean_reversion_M1_R1_R2_outcome_protocol_v1.json)" = "aa9d8eaa5106b809dc35e01f2498809cdfdc89ae"
          test "$(git hash-object scripts/run_broad_rmr_M1_R1_R2_outcomes.py)" = "3edddebe11db3165ee0b9517681d2ec453127b97"
          test "$(git hash-object tests/unit/test_broad_rmr_M1_R1_R2_outcomes.py)" = "40d94b454cb12d673ae6211095dd2fd0f6929939"
          test "$(git hash-object scripts/inventory_broad_rmr_M1_event_supply.py)" = "44802028ff784f6ac3bfc0937259875a9d8cf390"
          test "$(git hash-object scripts/run_broad_rmr_stage1_R1_R2_R3.py)" = "f5302a448f3acd2d0c784756a8240748f41418ba"
          test "$(git hash-object docs/governance/reversal_mean_reversion_stage1_event_adapter_v1.json)" = "a69cfb807d6b6788e9fa3d9860d4933316bdb891"
          test "$(git hash-object docs/governance/reversal_mean_reversion_stage1_partition_censor_v1.json)" = "df50cf952b7ee3302ec202eed4851d24c94bebc3"
      - name: Run M1 R1 R2 outcome boundary tests
        run: python -m pytest -q tests/unit/test_broad_rmr_M1_R1_R2_outcomes.py
      - name: Execute frozen M1 R1 R2 outcome screen
        run: python scripts/run_broad_rmr_M1_R1_R2_outcomes.py --output /tmp/M1_R1_R2_outcomes.json
      - name: Verify evidence and authority boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/M1_R1_R2_outcomes.json').read_text())
          assert x['source']['max_day'] <= '2020-12-31'
          assert x['source']['post_2020_rows_read'] is False
          assert x['parent'] == {'view':'5m_offset_0','birth_level':5}
          assert x['R3_reopened'] is False
          assert x['shock_fraction_search_performed'] is False
          assert x['excursion_threshold_search_performed'] is False
          assert x['parent_scale_or_offset_search_performed'] is False
          assert x['scientifically_fresh'] is False
          assert x['morphology_replication_accepted'] is False
          assert x['trading_PnL_used'] is False
          assert x['production_authority'] is False
          print('M1 R1 R2 outcome boundaries preserved')
          PY
      - name: Upload aggregate outcome receipt only
        uses: actions/upload-artifact@v4
        with:
          name: broad-rmr-M1-R1-R2-outcome-receipt
          path: /tmp/M1_R1_R2_outcomes.json
          if-no-files-found: error
