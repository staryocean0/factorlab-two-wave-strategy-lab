name: two-wave-v0648-scoring-determinacy-once

on:
  push:
    branches:
      - research/two-wave-reference-label-freeze-tooling-v0648
    paths-ignore:
      - experiments/two_wave_independent_reference_label_v0648/SCORING_DETERMINACY_AUDIT.json

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Run frozen pre-label scoring determinacy audit
        run: python scripts/audit_two_wave_v0648_scoring_determinacy.py
      - name: Commit aggregate determinacy audit only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_independent_reference_label_v0648/SCORING_DETERMINACY_AUDIT.json
          if git diff --cached --quiet; then
            echo "No determinacy audit change"
            exit 0
          fi
          git commit -m "Record v0648 pre-label scoring determinacy audit [skip ci]"
          git push origin HEAD:research/two-wave-reference-label-freeze-tooling-v0648
