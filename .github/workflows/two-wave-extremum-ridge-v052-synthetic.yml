name: two-wave-extremum-ridge-v052-synthetic
on:
  push:
    branches: ['codex/two-wave-phase1-20260905']
    paths:
      - 'src/factor_lab/visual_structure/two_wave/extremum_ridge_v052.py'
      - 'tests/unit/test_two_wave_extremum_ridge_v052.py'
      - 'docs/research/two_wave_extremum_ridge_protocol_v052.md'
      - '.github/workflows/two-wave-extremum-ridge-v052-synthetic.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: two-wave-extremum-ridge-v052-synthetic-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  synthetic-ridge-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e . editables==0.6
      - name: Validate bounded package
        run: |
          mkdir -p v052_synthetic_proof/source
          python scripts/validate_theme_package.py | tee v052_synthetic_proof/package_validation.json
          git rev-parse HEAD > v052_synthetic_proof/commit.txt
      - name: Full regression plus frozen v0.5.2 synthetic hard gates
        run: python -m pytest -q --junitxml=v052_synthetic_proof/tests.xml | tee v052_synthetic_proof/tests.log
      - name: Retain exact implementation and environment
        if: always()
        run: |
          python -m pip freeze > v052_synthetic_proof/environment.txt
          cp src/factor_lab/visual_structure/two_wave/extremum_ridge_v052.py v052_synthetic_proof/source/
          cp tests/unit/test_two_wave_extremum_ridge_v052.py docs/research/two_wave_extremum_ridge_protocol_v052.md v052_synthetic_proof/source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-wave-extremum-ridge-v052-synthetic-${{ github.sha }}
          path: v052_synthetic_proof/
          retention-days: 30
          if-no-files-found: error
