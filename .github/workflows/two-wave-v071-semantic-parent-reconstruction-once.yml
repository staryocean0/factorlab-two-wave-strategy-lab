name: two-wave-v071-semantic-parent-reconstruction-once

on:
  push:
    branches:
      - research/two-wave-ridge-supported-semantic-parent-reconstruction-v071
    paths-ignore:
      - experiments/two_wave_ridge_supported_semantic_parent_reconstruction_v071/RESULT.json

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Run frozen v0.7.1 semantic-parent reconstruction
        run: python scripts/run_two_wave_semantic_parent_reconstruction_v071.py
      - name: Commit aggregate result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_ridge_supported_semantic_parent_reconstruction_v071/RESULT.json
          if git diff --cached --quiet; then
            echo "No v071 result change"
            exit 0
          fi
          git commit -m "Record formal v071 semantic parent reconstruction [skip ci]"
          git push origin HEAD:research/two-wave-ridge-supported-semantic-parent-reconstruction-v071
