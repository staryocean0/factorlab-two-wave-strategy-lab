name: two-wave-v0647-resampler-equivalence-once

on:
  push:
    branches:
      - research/two-wave-independent-morphology-replication-v0647
    paths-ignore:
      - experiments/two_wave_independent_morphology_replication_v0647/**

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Prove Development 1m-to-five-offset exact equivalence
        run: >-
          python scripts/validate_two_wave_5m_offset_resampler_v0647.py
          --output experiments/two_wave_independent_morphology_replication_v0647/precheck
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0647-development-resampler-equivalence
          path: experiments/two_wave_independent_morphology_replication_v0647/precheck/
          retention-days: 30
