name: two-wave-v0702-governance-close-once

on:
  push:
    branches:
      - research/two-wave-f3-causal-publication-transplant-v0702

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Synchronize v0702 governance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          authority_path = root / 'experiments/two_wave_m0_authority.json'
          a = json.loads(authority_path.read_text())
          a['schema'] = 'two_wave_m0_authority@1.27'
          a['global_status'] = 'v0702_f3_immutable_event_certificate_supported_append_only_concept_salvaged_object_selection_unresolved'

          parent = a['component_authority']['parent_identity']
          parent['status'] = 'F3_development_candidate_immutable_event_supported_structural_selection_unresolved'
          parent['active_semantic_parent_authority'] = None
          parent['development_reconstruction_candidate'] = 'F3_persistence_dominant_nonconsecutive_quintet'
          parent['v0702_ordinary_F3_objects'] = 34029
          parent['v0702_certified_F3_objects'] = 31324
          parent['v0702_certified_object_fraction'] = 0.9205089776367216
          parent['v0702_certified_presence_fraction'] = 1.0
          parent['v0702_certified_object_count_median'] = 125.0
          parent['v0702_certified_object_count_q3'] = 152.25
          parent['v0702_gate_A_event_certificate_passed'] = True
          parent['v0702_gate_B_single_parent_identifiability_passed'] = False

          pub = a['component_authority']['raw_identity_publication']
          pub['status'] = 'append_only_publication_concept_salvaged_for_F3_exact_legacy_grouping_not_transplantable'
          pub['v0702_append_only_concept_salvaged'] = True
          pub['v0702_exact_v065_function_transplantable_unchanged'] = False
          pub['v0702_certificate_delay_median_bars'] = 0.0
          pub['v0702_certificate_delay_q3_bars'] = 4.0
          pub['v0702_certificate_replay_failures'] = 0

          scale = a['component_authority']['same_scale_semantics']
          scale['status'] = 'historical_component_waiting_F3_selection_then_generalized_projection_before_retest'

          q = a['component_authority']['qualification_policy']
          q['status'] = 'legacy_object_development_champion_waiting_F3_selection_projection_before_transplantation_retest'

          pd = a['component_authority']['parent_direction']
          pd['status'] = 'historical_direction_components_waiting_F3_selection_projection_qualification_before_transplantation_retest'

          a['semantic_bridge_counteroffensive'] = a.get('semantic_bridge_counteroffensive', {})
          a['semantic_bridge_counteroffensive']['v0702'] = {
              'status': 'complete_event_certificate_supported_append_only_concept_salvaged_object_selection_unresolved',
              'protocol': 'docs/research/TWO_WAVE_F3_CAUSAL_PUBLICATION_TRANSPLANT_V0702_PROTOCOL.md',
              'protocol_freeze_commit': '9b062153bd28b9591b66eb26fcebf8f1d431a24f',
              'formal_workflow_run': 34679691056,
              'formal_result_commit': '291633b7063e16acc7f39f261cefb1ff175d4cfb',
              'result': 'experiments/two_wave_f3_causal_publication_transplant_v0702/RESULT.json',
              'result_card': 'experiments/two_wave_f3_causal_publication_transplant_v0702/RESULT_CARD.md',
              'adjudication': 'experiments/two_wave_f3_causal_publication_transplant_v0702/ADJUDICATION.json',
              'packet_cutoffs': 240,
              'ordinary_F3_objects': 34029,
              'certified_F3_objects': 31324,
              'certified_object_fraction': 0.9205089776367216,
              'certified_presence_fraction_given_F3_positive_cutoff': 1.0,
              'certificate_delay_median_bars': 0.0,
              'certificate_delay_q3_bars': 4.0,
              'certified_object_count_median': 125.0,
              'certified_object_count_q3': 152.25,
              'gate_A_causal_certificate_coverage': True,
              'gate_B_direct_single_parent_publication_identifiability': False,
              'v065_append_only_publication_concept_salvaged': True,
              'v064_projection_transplantable_unchanged': False,
              'human_reference_labels_used': False,
              'packet_stratum_used': False,
              'threshold_fitting_performed': False,
              'qualification_changed': False,
              'direction_winner_changed': False,
              'morphology_acceptance_changed': False,
              'trade_authority_changed': False,
              'production_authority_changed': False
          }

          a['current_parent_representation_status'] = 'F3_immutable_event_semantics_supported_parent_selection_uniqueness_unresolved'
          a['current_independent_reference_calibrated_qualification_authority'] = None
          a['no_active_semantic_parent_authority'] = True
          a['no_current_direction_challenger_authorized'] = True
          a['next_authorized_step'] = (
              'freeze a purely structural F3 object-selection / uniqueness audit using no human-anchor proximity and no fitted amplitude, duration, distance, persistence, multiplicity, or delay thresholds; '
              'if a deterministic parent identity is supported, then freeze generalized F3 raw projection; thereafter retest v0.5.4/v0.6.18 qualification and then D1/v0.6.25 direction sequentially'
          )
          forbidden = a.setdefault('forbidden_next_shortcuts', [])
          for item in [
              'publish_one_F3_parent_by_human_anchor_proximity',
              'fit_F3_object_selection_weights_or_thresholds_from_v0648_labels',
              'choose_F3_parent_by_future_return_or_direction_agreement',
              'open_generalized_raw_projection_before_F3_parent_selection_is_frozen',
              'declare_v065_publication_concept_invalid_after_v0702_gate_A_pass',
              'restore_v0618_or_v0625_active_authority_before_sequential_transplantation_retests'
          ]:
              if item not in forbidden:
                  forbidden.append(item)
          authority_path.write_text(json.dumps(a, ensure_ascii=False, indent=2) + '\n')

          human_path = root / 'docs/research/TWO_WAVE_M0_AUTHORITY.md'
          h = human_path.read_text()
          section = '''\n\n## v0.7.2: F3 causal event/publication + downstream transplant precheck — append-only concept salvaged; selection unresolved\n\nFrozen protocol: `docs/research/TWO_WAVE_F3_CAUSAL_PUBLICATION_TRANSPLANT_V0702_PROTOCOL.md`.  \nProtocol freeze commit: `9b062153bd28b9591b66eb26fcebf8f1d431a24f`.  \nFormal workflow run: `34679691056`.  \nFormal result commit: `291633b7063e16acc7f39f261cefb1ff175d4cfb`.  \nResult: `experiments/two_wave_f3_causal_publication_transplant_v0702/RESULT.json`.  \nResult card: `experiments/two_wave_f3_causal_publication_transplant_v0702/RESULT_CARD.md`.  \nGovernance adjudication: `experiments/two_wave_f3_causal_publication_transplant_v0702/ADJUDICATION.json`.\n\nThe primary audit was label-blind across all 240 frozen packet cutoffs. `31,324 / 34,029 = 92.05%` of ordinary final-cutoff F3 objects received a monotone explicit-death certificate by the same cutoff, all `240/240` F3-positive cutoffs contained a certified object, and certificate replay failures were zero. Median certificate delay was `0` bars and Q3 `4` bars. Gate A therefore passes and the historical v0.6.5 **append-only publication concept is salvaged** for F3.\n\nHowever, event certification does not identify one parent: certified-object multiplicity per cutoff has median `125` and Q3 `152.25`, massively outside the frozen `<=1 / <=2` direct-publication band. Gate B fails. Formal verdict: **`v0702_f3_immutable_event_certificate_supported_append_only_concept_salvaged_object_selection_unresolved`**.\n\nThe old v0.6.5 exact grouping/function is not reused unchanged. v0.6.4 predecessor projection is also not directly transplantable because it requires consecutive birth-level nodes, while F3 is nonconsecutive; the sequential projection idea itself remains alive. Qualification and direction remain queued for later transplantation rather than rejected.\n\nNext authorized step: a separately frozen purely structural F3 object-selection / uniqueness audit. Generalized raw projection remains blocked until a deterministic parent identity is frozen.\n'''
          if '## v0.7.2: F3 causal event/publication + downstream transplant precheck' not in h:
              h += section
          human_path.write_text(h)

          ledger_path = root / 'docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md'
          l = ledger_path.read_text()
          section2 = '''\n\n## v0.7.2 F3 publication salvage / direction hold\n\n- Label-blind event audit salvages the append-only publication concept: F3 certificate coverage `92.05%`, cutoff presence `100%`, replay failures `0`.\n- Direct parent publication is not yet identified because certified F3 multiplicity is median `125`, Q3 `152.25`.\n- v0.6.18 and D1/v0.6.25 remain historical results queued for transplantation; no direction test is reopened yet.\n- Next: structural F3 object selection / uniqueness, then generalized projection, qualification retest, and direction retest in sequence.\n'''
          if '## v0.7.2 F3 publication salvage / direction hold' not in l:
              l += section2
          ledger_path.write_text(l)

          index_path = root / 'docs/INDEX.md'
          idx = index_path.read_text()
          idx_section = '''\n\n### v0.7.2 F3 causal event/publication + transplant precheck — complete\n\n- Protocol: `research/TWO_WAVE_F3_CAUSAL_PUBLICATION_TRANSPLANT_V0702_PROTOCOL.md`\n- Result: `../experiments/two_wave_f3_causal_publication_transplant_v0702/RESULT.json`\n- Result card: `../experiments/two_wave_f3_causal_publication_transplant_v0702/RESULT_CARD.md`\n- Governance adjudication: `../experiments/two_wave_f3_causal_publication_transplant_v0702/ADJUDICATION.json`\n- Verdict: `v0702_f3_immutable_event_certificate_supported_append_only_concept_salvaged_object_selection_unresolved`.\n- Next: freeze purely structural F3 object-selection / uniqueness audit.\n'''
          if '### v0.7.2 F3 causal event/publication + transplant precheck — complete' not in idx:
              idx += idx_section
          index_path.write_text(idx)

          readme_path = root / 'README.md'
          r = readme_path.read_text()
          paragraph = '''v0.7.2 has now supplied F3 with a label-blind immutable causal event certificate. Across all 240 frozen packet cutoffs, `92.05%` of ordinary F3 objects are death-certified by the same cutoff and every F3-positive cutoff has at least one certified object; the v0.6.5 append-only publication **concept** is therefore salvaged. The remaining blocker is not causal timing but parent identity multiplicity: certified F3 count is median `125`, Q3 `152.25`, so one parent cannot be published directly. The next authorized stage is **purely structural F3 object selection / uniqueness**. Generalized raw projection, qualification transplantation, and direction transplantation remain sequenced behind that freeze. `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`.'''
          if paragraph not in r:
              r += '\n\n' + paragraph + '\n'
          readme_path.write_text(r)
          PY
      - name: Commit v0702 governance closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_m0_authority.json docs/research/TWO_WAVE_M0_AUTHORITY.md docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md docs/INDEX.md README.md
          git commit -m "Close v0702 F3 causal publication governance [skip ci]"
          git push origin HEAD:research/two-wave-f3-causal-publication-transplant-v0702
