name: two-wave-frequency-workspace
on:
  push:
    branches: ['codex/two-wave-phase1-20260905']
    paths: ['.github/workflows/two-wave-frequency-workspace.yml']
permissions:
  contents: read
jobs:
  pinned-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download pinned public reader for isolated CPython313 analysis
        run: >-
          python -m pip download --only-binary=:all: --no-deps
          --platform manylinux_2_28_x86_64 --python-version 313
          --implementation cp --abi cp313 --dest runtime_wheels pyarrow==19.0.1
      - uses: actions/upload-artifact@v4
        with:
          name: two-wave-pinned-reader-${{ github.sha }}
          path: runtime_wheels/
          retention-days: 30
