name: two-wave-leg-efficiency-definition-poc-v053
on:
  workflow_dispatch:
  push:
    branches: ['codex/two-wave-phase1-20260905']
    paths:
      - 'scripts/run_two_wave_leg_efficiency_definition_poc_v053.py'
      - 'docs/research/two_wave_leg_efficiency_definition_preanalysis_v053.md'
      - '.github/workflows/two-wave-leg-efficiency-definition-poc-v053.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: two-wave-leg-efficiency-definition-poc-v053-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  read-only-definition-competition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e . editables==0.6
      - name: Validate bounded package and frozen data
        run: |
          mkdir -p v053_efficiency_definition_poc_proof/source
          python scripts/validate_theme_package.py | tee v053_efficiency_definition_poc_proof/package_validation.json
          git rev-parse HEAD > v053_efficiency_definition_poc_proof/commit.txt
      - name: Full regression before definition competition
        run: python -m pytest -q --junitxml=v053_efficiency_definition_poc_proof/tests.xml | tee v053_efficiency_definition_poc_proof/tests.log
      - name: Run frozen v0.5.2 candidates through read-only efficiency definitions
        run: |
          python scripts/run_two_wave_leg_efficiency_definition_poc_v053.py | tee v053_efficiency_definition_poc_proof/research.log
          git diff --exit-code -- data src tests scripts docs/research pyproject.toml
      - name: Retain exact analysis source and environment
        if: always()
        run: |
          python -m pip freeze > v053_efficiency_definition_poc_proof/environment.txt
          cp scripts/run_two_wave_leg_efficiency_definition_poc_v053.py v053_efficiency_definition_poc_proof/source/
          cp docs/research/two_wave_leg_efficiency_definition_preanalysis_v053.md v053_efficiency_definition_poc_proof/source/
          cp docs/research/two_wave_qualification_attribution_results_v052.md v053_efficiency_definition_poc_proof/source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: two-wave-leg-efficiency-definition-poc-v053-${{ github.sha }}
          path: |
            cloud_results/two_wave_leg_efficiency_definition_poc_v053/
            v053_efficiency_definition_poc_proof/
          retention-days: 30
          if-no-files-found: error
