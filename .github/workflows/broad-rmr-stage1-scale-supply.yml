name: broad-rmr-stage1-scale-supply

on:
  push:
    branches:
      - codex/broad-reversal-authority-reset-20260908
    paths:
      - 'scripts/select_broad_rmr_stage1_scale_by_supply.py'
      - 'docs/governance/reversal_mean_reversion_M0_scale_semantics_binding_v1.json'
      - '.github/workflows/broad-rmr-stage1-scale-supply.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outcome-blind-scale-supply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install pandas pyarrow
      - name: Select representation level from structural supply only
        run: python scripts/select_broad_rmr_stage1_scale_by_supply.py --output /tmp/broad_rmr_scale_supply.json
      - name: Verify no price outcome access
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/broad_rmr_scale_supply.json').read_text())
          assert x['price_columns_read'] is False
          assert x['future_price_outcomes_read'] is False
          assert x['selection_rule']=='smallest_parent_level_with_supply_gate_for_parent_and_adjacent_finer_level'
          print('outcome-blind scale selection boundary preserved')
          PY
      - name: Upload supply-only receipt
        uses: actions/upload-artifact@v4
        with:
          name: broad-rmr-stage1-scale-supply
          path: /tmp/broad_rmr_scale_supply.json
          if-no-files-found: error
