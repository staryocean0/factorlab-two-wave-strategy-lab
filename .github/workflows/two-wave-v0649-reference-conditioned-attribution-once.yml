name: two-wave-v0649-reference-conditioned-attribution-once

on:
  push:
    branches:
      - research/two-wave-reference-conditioned-qualification-attribution-v0649
    paths-ignore:
      - experiments/two_wave_reference_conditioned_qualification_attribution_v0649/RESULT.json

permissions:
  contents: write

jobs:
  attribute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Run frozen v0.6.49 reference-conditioned attribution
        run: python scripts/run_two_wave_reference_conditioned_qualification_attribution_v0649.py
      - name: Commit aggregate result only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_reference_conditioned_qualification_attribution_v0649/RESULT.json
          if git diff --cached --quiet; then
            echo "No v0649 result change"
            exit 0
          fi
          git commit -m "Record formal v0649 qualification failure attribution [skip ci]"
          git push origin HEAD:research/two-wave-reference-conditioned-qualification-attribution-v0649
