name: broad-rmr-stage1-R1-R2-R3

on:
  push:
    branches:
      - codex/broad-reversal-authority-reset-20260908
    paths:
      - 'scripts/run_broad_rmr_stage1_R1_R2_R3.py'
      - 'tests/unit/test_broad_rmr_stage1_R1_R2_R3.py'
      - 'docs/governance/reversal_mean_reversion_common_measurement_contract_v1.json'
      - 'docs/governance/reversal_mean_reversion_stage1_screening_plan_v1.json'
      - 'docs/governance/reversal_mean_reversion_stage1_event_adapter_v1.json'
      - 'docs/governance/reversal_mean_reversion_stage1_partition_censor_v1.json'
      - 'docs/governance/reversal_mean_reversion_stage1_R1_R2_R3_execution_freeze_v1.json'
      - 'docs/research/cloud_session_20260908_broad_rmr_stage1_scale_supply_receipt_v2.json'
      - '.github/workflows/broad-rmr-stage1-R1-R2-R3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-broad-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: python -m pip install pytest numpy pandas pyarrow scikit-learn
      - name: Verify frozen blob identities
        run: |
          test "$(git hash-object docs/governance/reversal_mean_reversion_common_measurement_contract_v1.json)" = "798a1f70409b257c55648009a57ef08084d853b5"
          test "$(git hash-object docs/governance/reversal_mean_reversion_stage1_screening_plan_v1.json)" = "a4edf275a220e9086a4dc2705b98ee5ef962fed8"
          test "$(git hash-object docs/governance/reversal_mean_reversion_stage1_event_adapter_v1.json)" = "a69cfb807d6b6788e9fa3d9860d4933316bdb891"
          test "$(git hash-object docs/governance/reversal_mean_reversion_stage1_partition_censor_v1.json)" = "df50cf952b7ee3302ec202eed4851d24c94bebc3"
          test "$(git hash-object docs/research/cloud_session_20260908_broad_rmr_stage1_scale_supply_receipt_v2.json)" = "230e9558fe40a23dcb64b82f194507e83d7e9ee7"
          test "$(git hash-object scripts/run_broad_rmr_stage1_R1_R2_R3.py)" = "f5302a448f3acd2d0c784756a8240748f41418ba"
          test "$(git hash-object tests/unit/test_broad_rmr_stage1_R1_R2_R3.py)" = "e387ea5964957f8cfba0ca027f9acb171c179f2a"
      - name: Run synthetic and scientific-boundary tests
        run: python -m pytest -q tests/unit/test_broad_rmr_stage1_R1_R2_R3.py
      - name: Execute frozen broad R1 R2 R3 screen
        run: python scripts/run_broad_rmr_stage1_R1_R2_R3.py --output /tmp/broad_rmr_stage1_receipt.json
      - name: Verify evidence and authority boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/broad_rmr_stage1_receipt.json').read_text())
          assert x['source']['max_day'] <= '2020-12-31'
          assert x['source']['post_2020_rows_read'] is False
          assert x['scale'] == {'parent_level':5,'finer_level':3}
          assert x['scientifically_fresh'] is False
          assert x['morphology_replication_accepted'] is False
          assert x['trading_PnL_used'] is False
          assert x['production_authority'] is False
          print('broad RMR Stage1 boundaries preserved')
          PY
      - name: Upload aggregate receipt only
        uses: actions/upload-artifact@v4
        with:
          name: broad-rmr-stage1-R1-R2-R3-receipt
          path: /tmp/broad_rmr_stage1_receipt.json
          if-no-files-found: error
