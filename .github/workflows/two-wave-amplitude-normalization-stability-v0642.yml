name: two-wave-amplitude-normalization-stability-v0642-once

on:
  push:
    branches:
      - research/two-wave-amplitude-normalization-stability-v0642
    paths-ignore:
      - experiments/two_wave_amplitude_normalization_stability_v0642/**

permissions:
  actions: read
  contents: write

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q

  attribution:
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Download frozen v0618 identity artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34423674192
          pattern: v0618-5m_offset_*
          path: tmp/v0642_input
          merge-multiple: true
      - name: Run frozen v0642 amplitude-normalization stability attribution
        run: >-
          python scripts/run_two_wave_amplitude_normalization_stability_v0642_cardfix.py
          --input tmp/v0642_input
          --output experiments/two_wave_amplitude_normalization_stability_v0642
      - uses: actions/upload-artifact@v4
        with:
          name: v0642-amplitude-normalization-stability
          path: experiments/two_wave_amplitude_normalization_stability_v0642/
          retention-days: 30
      - name: Commit formal v0642 attribution bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_amplitude_normalization_stability_v0642
          if git diff --cached --quiet; then
            echo "Result bundle already identical; nothing to commit."
            exit 0
          fi
          git commit -m "Record formal v0642 amplitude-normalization stability attribution"
          git push
