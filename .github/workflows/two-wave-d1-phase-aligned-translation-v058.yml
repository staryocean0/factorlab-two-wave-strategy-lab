name: two-wave-d1-phase-aligned-translation-v058
on:
  push:
    branches: ['codex/two-wave-phase1-20260905']
    paths:
      - 'docs/research/two_wave_d1_phase_aligned_translation_protocol_v058.md'
      - 'src/factor_lab/visual_structure/two_wave/parent_translation_v058.py'
      - 'tests/unit/test_two_wave_parent_translation_v058.py'
      - 'scripts/run_two_wave_d1_phase_aligned_translation_v058.py'
      - '.github/workflows/two-wave-d1-phase-aligned-translation-v058.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  poc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e . editables==0.6
      - name: Full regression and frozen PAWCT synthetic hard gates
        run: python -m pytest -q
      - uses: actions/download-artifact@v4
        with:
          pattern: v056-native5m-*-266bac6389098169598084667fcb46897a53ccf2
          path: downloaded_v056_views
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: 34009427027
          repository: staryocean0/factorlab-two-wave-strategy-lab
      - uses: actions/download-artifact@v4
        with:
          pattern: two-wave-d1-uncertain-resolution-geometry-v057b-d1524ad005783649c546c135d9e8b263e21c8a59
          path: downloaded_v057b
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: 34010814782
          repository: staryocean0/factorlab-two-wave-strategy-lab
      - name: Run frozen PAWCT continuous-representation POC
        shell: bash
        run: |
          set -o pipefail
          mkdir -p v058_poc_proof/source
          git rev-parse HEAD > v058_poc_proof/commit.txt
          python scripts/run_two_wave_d1_phase_aligned_translation_v058.py \
            --formal-root downloaded_v056_views \
            --v057b-root downloaded_v057b \
            | tee v058_poc_proof/research.log
          cp docs/research/two_wave_d1_phase_aligned_translation_protocol_v058.md \
             src/factor_lab/visual_structure/two_wave/parent_translation_v058.py \
             tests/unit/test_two_wave_parent_translation_v058.py \
             scripts/run_two_wave_d1_phase_aligned_translation_v058.py \
             v058_poc_proof/source/
          git diff --exit-code -- data src tests scripts docs/research pyproject.toml
      - uses: actions/upload-artifact@v4
        with:
          name: two-wave-d1-phase-aligned-translation-v058-${{ github.sha }}
          path: |
            cloud_results/two_wave_d1_phase_aligned_translation_v058/
            v058_poc_proof/
          retention-days: 30
          if-no-files-found: error
