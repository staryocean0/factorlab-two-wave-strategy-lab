name: two-wave-v0701-governance-close-once

on:
  push:
    branches:
      - research/two-wave-ridge-semantic-objectization-v0701

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Synchronize v0701 governance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          authority_path = root / 'experiments/two_wave_m0_authority.json'
          a = json.loads(authority_path.read_text())
          a['schema'] = 'two_wave_m0_authority@1.26'
          a['global_status'] = 'v0701_persistence_dominant_objectization_candidate_supported_f3_event_publication_transplant_precheck_next'

          parent = a['component_authority']['parent_identity']
          parent['status'] = 'legacy_exact_tuple_demoted_f3_persistence_dominant_objectization_development_candidate_supported'
          parent['active_semantic_parent_authority'] = None
          parent['development_reconstruction_candidate'] = 'F3_persistence_dominant_nonconsecutive_quintet'
          parent['v0701_F0_legacy_support_cases'] = 3
          parent['v0701_F1_upper_bound_support_cases'] = 10
          parent['v0701_F2_one_step_survivor_support_cases'] = 5
          parent['v0701_F3_persistence_dominant_support_cases'] = 8
          parent['v0701_F3_median_candidate_objects'] = 142.0
          parent['v0701_F3_median_compatible_objects'] = 1.0
          parent['v0701_F3_exactly_one_compatible_cases'] = 5
          parent['v0701_morphology_authority_granted'] = False

          a['semantic_bridge_counteroffensive'] = a.get('semantic_bridge_counteroffensive', {})
          a['semantic_bridge_counteroffensive']['v0701'] = {
              'status': 'complete_persistence_dominant_objectization_candidate_supported',
              'protocol': 'docs/research/TWO_WAVE_RIDGE_SEMANTIC_OBJECTIZATION_V0701_PROTOCOL.md',
              'protocol_freeze_commit': 'd5d90b16f6f9f1b4072fe23952085a10ea64682f',
              'formal_workflow_run': 34677630544,
              'formal_result_commit': 'bc6f75a9734e90bbb158ea3377fd3710a391450e',
              'result': 'experiments/two_wave_ridge_semantic_objectization_v0701/RESULT.json',
              'result_card': 'experiments/two_wave_ridge_semantic_objectization_v0701/RESULT_CARD.md',
              'adjudication': 'experiments/two_wave_ridge_semantic_objectization_v0701/ADJUDICATION.json',
              'F0_support_cases': 3,
              'F1_support_cases': 10,
              'F2_support_cases': 5,
              'F3_support_cases': 8,
              'selected_reconstruction_family': 'F3_persistence_dominant_nonconsecutive_quintet',
              'development_reconstruction_candidate_supported': True,
              'morphology_authority_granted': False,
              'threshold_fitting_performed': False,
              'qualification_changed': False,
              'direction_winner_changed': False,
              'trade_authority_changed': False,
              'production_authority_changed': False,
          }

          pub = a['component_authority']['raw_identity_publication']
          pub['status'] = 'historical_component_queued_for_f3_event_publication_transplant_precheck_not_declared_false'

          scale = a['component_authority']['same_scale_semantics']
          scale['status'] = 'historical_component_awaiting_retest_after_f3_event_publication_and_projection_freeze'

          q = a['component_authority']['qualification_policy']
          q['status'] = 'legacy_object_development_champion_queued_for_transplantation_retest_after_f3_parent_freeze'

          pd = a['component_authority']['parent_direction']
          pd['status'] = 'historical_direction_components_queued_for_transplantation_retest_after_f3_parent_and_qualification_freeze'

          a['current_parent_representation_status'] = 'F3_persistence_dominant_nonconsecutive_quintet_supported_as_development_reconstruction_candidate_only'
          a['current_independent_reference_calibrated_qualification_authority'] = None
          a['no_current_direction_challenger_authorized'] = True
          a['no_active_semantic_parent_authority'] = True
          a['next_authorized_step'] = (
              'freeze causal F3 event/publication semantics and downstream transplantation precheck; '
              'test causal first-known time, object multiplicity, rewrite risk, and whether the v0.6.5 append-only publication concept can be transplanted without human-label fitting; '
              'only after event/publication freeze may raw projection, v0.5.4/v0.6.18 qualification, and D1/v0.6.25 direction be re-tested sequentially'
          )
          forbidden = a.setdefault('forbidden_next_shortcuts', [])
          for item in [
              'promote_F3_to_morphology_authority_from_8_of_11_development_cases',
              'fit_F3_persistence_threshold_from_v0648_labels',
              'fit_bar_distance_or_skip_count_to_make_F3_pass_more_cases',
              'reuse_v0618_or_v0625_as_active_authority_before_F3_event_publication_and_projection_freeze',
              'declare_v064_v065_v0618_D1_v0625_false_without_transplantation_retest'
          ]:
              if item not in forbidden:
                  forbidden.append(item)
          authority_path.write_text(json.dumps(a, ensure_ascii=False, indent=2) + '\n')

          human_path = root / 'docs/research/TWO_WAVE_M0_AUTHORITY.md'
          h = human_path.read_text()
          section = '''\n\n## v0.7.1: ridge-supported semantic parent objectization reconstruction — F3 supported as Development candidate\n\nFrozen protocol: `docs/research/TWO_WAVE_RIDGE_SEMANTIC_OBJECTIZATION_V0701_PROTOCOL.md`.  \nProtocol freeze commit: `d5d90b16f6f9f1b4072fe23952085a10ea64682f`.  \nFormal workflow run: `34677630544`.  \nFormal result commit: `bc6f75a9734e90bbb158ea3377fd3710a391450e`.  \nResult: `experiments/two_wave_ridge_semantic_objectization_v0701/RESULT.json`.  \nResult card: `experiments/two_wave_ridge_semantic_objectization_v0701/RESULT_CARD.md`.  \nGovernance adjudication: `experiments/two_wave_ridge_semantic_objectization_v0701/ADJUDICATION.json`.\n\nThe counteroffensive preserved the causal TCSS/ridge infrastructure and tested preregistered structural objectizations on the 11 independently anchored human-positive cases. Legacy exact-consecutive F0 reproduces only `3/11`; the unrestricted nonconsecutive F1 upper bound reaches `10/11` but is combinatorially non-identifying (median `35,888` candidate objects); F2 one-step survivors reach `5/11`; and F3 persistence-dominant nonconsecutive quintets reach the frozen Development support threshold exactly at **`8/11`**, with median `142` candidate objects and median `1` human-compatible object.\n\nFormal verdict: **`v0701_persistence_dominant_objectization_candidate_supported`**. F3 is a Development reconstruction candidate only, not active morphology authority. The legacy exact-consecutive tuple remains historical baseline evidence. Downstream publication, projection, qualification, and direction components are not declared false: they remain queued for transplantation tests.\n\nThe next authorized step is a separately frozen causal F3 event/publication and downstream-transplant precheck. It must define first-known/immutable object semantics and quantify multiplicity/rewrite risk without fitting F3 parameters to the human labels.\n'''
          if '## v0.7.1: ridge-supported semantic parent objectization reconstruction' not in h:
              h += section
          human_path.write_text(h)

          ledger_path = root / 'docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md'
          l = ledger_path.read_text()
          section2 = '''\n\n## v0.7.1 semantic-parent reconstruction / direction hold\n\n- Upstream objectization reconstruction only; not a direction contribution.\n- F3 persistence-dominant nonconsecutive quintet supports `8/11` anchored human-positive cases and is retained as a Development reconstruction candidate.\n- D1 and v0.6.25 are **not invalidated**; they remain historical direction components awaiting transplantation after F3 event/publication, raw projection, and qualification are frozen.\n- No direction challenger is authorized at this stage.\n'''
          if '## v0.7.1 semantic-parent reconstruction / direction hold' not in l:
              l += section2
          ledger_path.write_text(l)

          index_path = root / 'docs/INDEX.md'
          idx = index_path.read_text()
          idx_section = '''\n\n### v0.7.1 ridge-supported semantic parent objectization — complete\n\n- Protocol: `research/TWO_WAVE_RIDGE_SEMANTIC_OBJECTIZATION_V0701_PROTOCOL.md`\n- Result: `../experiments/two_wave_ridge_semantic_objectization_v0701/RESULT.json`\n- Result card: `../experiments/two_wave_ridge_semantic_objectization_v0701/RESULT_CARD.md`\n- Governance adjudication: `../experiments/two_wave_ridge_semantic_objectization_v0701/ADJUDICATION.json`\n- Verdict: `v0701_persistence_dominant_objectization_candidate_supported`; F3 passes the frozen Development support gate at `8/11`.\n- Next: freeze causal F3 event/publication semantics and downstream transplantation precheck.\n'''
          if '### v0.7.1 ridge-supported semantic parent objectization — complete' not in idx:
              idx += idx_section
          index_path.write_text(idx)

          readme_path = root / 'README.md'
          r = readme_path.read_text()
          old = '''Current global stage is therefore **filtered exact-ridge vs raw-projection vs frozen-human-anchor layer attribution required**. The predecessor / first-valid publication route is closed as the material explanation, but p0 correspondence itself remains unresolved. No projection-window fit, boundary tolerance, ridge remapping, semantic-object challenger, qualification change, or direction challenger is authorized. `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`.'''
          if old in r:
              r = r.replace(old, '''v0.7.0 localized the first large semantic loss to exact-consecutive five-ridge objectization: common-scale ridge support was `10/11`, while the legacy exact tuple supported only `3/11`. This preserves the causal ridge infrastructure but demotes the exact tuple from semantic-parent authority. Downstream v0.6.x components remain retained for transplantation retests rather than blanket rejection.''')
          old2 = '''v0.7.0 has now opened the counteroffensive. Ridge infrastructure is salvaged (`10/11`), while exact consecutive five-ridge tuple objectization is the first localized semantic break (`3/11`). Downstream v0.6.x components are retained for transplantation retests, not blanket-rejected. Next: v0.7.1 ridge-supported semantic parent objectization reconstruction.'''
          new2 = '''v0.7.1 has now reconstructed a ridge-supported semantic-parent candidate without fitting label-distance or persistence thresholds. F3 — the **persistence-dominant nonconsecutive quintet** — supports `8/11` anchored human-positive cases, versus legacy F0 `3/11`, F2 `5/11`, and the non-identifying F1 upper bound `10/11`. F3 is Development evidence only and is not morphology authority. The next authorized stage is **causal F3 event/publication + downstream transplantation precheck**: first freeze first-known/immutable F3 object semantics, then test whether historical raw projection/publication, qualification, and direction results can be transplanted sequentially. `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`.'''
          if old2 in r:
              r = r.replace(old2, new2)
          elif new2 not in r:
              r += '\n\n' + new2 + '\n'
          readme_path.write_text(r)
          PY
      - name: Commit v0701 governance closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_m0_authority.json docs/research/TWO_WAVE_M0_AUTHORITY.md docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md docs/INDEX.md README.md
          git commit -m "Close v0701 ridge semantic objectization governance [skip ci]"
          git push origin HEAD:research/two-wave-ridge-semantic-objectization-v0701
