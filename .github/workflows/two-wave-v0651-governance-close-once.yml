name: two-wave-v0651-governance-close-once

on:
  push:
    branches:
      - research/two-wave-left-boundary-internal-pivot-decomposition-v0651

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/validate_theme_package.py
      - run: pytest -q
      - name: Synchronize v0651 governance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          authority_path = root / 'experiments/two_wave_m0_authority.json'
          a = json.loads(authority_path.read_text())
          a['schema'] = 'two_wave_m0_authority@1.23'
          a['global_status'] = 'v0651_correspondence_decomposition_mixed_or_unresolved_ordinal0_publication_lineage_audit_next'

          parent = a['component_authority']['parent_identity']
          parent['status'] = 'supported_research_component_reference_correspondence_unresolved_start_side_lineage_clue'
          parent['independent_reference_correspondence_status'] = 'mixed_or_indeterminate'
          parent['v0651_median_p0_absolute_error_bars'] = 17.0
          parent['v0651_median_p4_absolute_error_bars'] = 4.0
          parent['v0651_start_abs_gt_end_abs_count'] = 9
          parent['v0651_median_translation_mae_reduction_fraction'] = 0.5753424657534246
          parent['v0651_median_internal_phase_mae'] = 0.08397271952259165
          parent['v0651_median_leg_share_mae'] = 0.07569386038687974
          parent['v0651_left_boundary_dominant_gate_passed'] = False
          parent['v0651_internal_phase_mismatch_gate_passed'] = False

          q = a['component_authority']['qualification_policy']
          q['status'] = 'development_champion_failed_independent_reference_calibration_parent_identity_lineage_unresolved'
          q['development_champion'] = True
          q['independent_reference_calibrated'] = False

          a['left_boundary_internal_pivot_decomposition'] = {
              'v0651': {
                  'status': 'complete_mixed_or_unresolved',
                  'protocol': 'docs/research/TWO_WAVE_LEFT_BOUNDARY_INTERNAL_PIVOT_DECOMPOSITION_V0651_PROTOCOL.md',
                  'protocol_freeze_commit': 'ea6511289ab3131565bf13948f37663937e4dc41',
                  'formal_workflow_run': 34667721079,
                  'formal_result_commit': '459ea2ee7f7960af4db4e4a086348edc2911fec8',
                  'result': 'experiments/two_wave_left_boundary_internal_pivot_decomposition_v0651/RESULT.json',
                  'result_card': 'experiments/two_wave_left_boundary_internal_pivot_decomposition_v0651/RESULT_CARD.md',
                  'adjudication': 'experiments/two_wave_left_boundary_internal_pivot_decomposition_v0651/ADJUDICATION.json',
                  'anchored_reference_positive_cases': 11,
                  'median_p0_absolute_error_bars': 17.0,
                  'median_p4_absolute_error_bars': 4.0,
                  'start_abs_gt_end_abs_count': 9,
                  'median_boundary_offset_disagreement_bars': 12.0,
                  'median_raw_anchor_mae_bars': 11.8,
                  'median_translation_removed_anchor_mae_bars': 3.8,
                  'median_translation_mae_reduction_fraction': 0.5753424657534246,
                  'median_internal_phase_mae': 0.08397271952259165,
                  'median_leg_share_mae': 0.07569386038687974,
                  'median_center_pivot_abs_phase_error': 0.04137529137529128,
                  'rigid_translation_dominant': False,
                  'left_boundary_dominant': False,
                  'end_boundary_dominant': False,
                  'internal_pivot_phase_mismatch': False,
                  'mixed_boundary_and_internal_mismatch': False,
                  'internal_geometry_corresponds_after_boundary_normalization': False,
                  'primary_category': 'v0651_correspondence_decomposition_mixed_or_unresolved',
                  'posthoc_relaxation_of_0_08_phase_gate_performed': False,
                  'threshold_fitting_performed': False,
                  'pivot_remapping_performed': False,
                  'qualification_changed': False,
                  'direction_winner_changed': False,
                  'morphology_acceptance_changed': False,
                  'trade_authority_changed': False,
                  'production_authority_changed': False
              }
          }
          a['current_parent_representation_status'] = 'v0651_start_side_and_translation_clues_but_no_frozen_mechanism_gate_passed'
          a['current_independent_reference_calibrated_qualification_authority'] = None
          a['next_authorized_step'] = (
              'freeze a read-only ordinal-0 predecessor-support and first-valid-publication lineage/provenance audit; '
              'test whether p0 is generated by a structurally different causal lineage than p1-p4 and whether that asymmetry is inherent to the algorithm; '
              'do not use v0648/v0651 anchor errors to fit start-boundary tolerances, translation corrections, pivot remapping, or a semantic-object challenger'
          )
          a['no_current_direction_challenger_authorized'] = True
          a['no_current_semantic_object_challenger_authorized'] = True
          forbidden = a.setdefault('forbidden_next_shortcuts', [])
          for item in [
              'relax_v0651_internal_phase_correspondence_gate_from_0_08_to_0_085_after_result',
              'round_0_0839727_down_and_claim_left_boundary_dominance',
              'fit_case_level_translation_correction_from_v0651',
              'fit_start_boundary_tolerance_from_v0651_p0_errors',
              'remap_p0_or_internal_pivots_to_human_reference_anchors',
              'promote_left_boundary_mechanism_without_ordinal0_lineage_audit',
              'resume_direction_feature_mining_before_parent_identity_lineage_is_resolved'
          ]:
              if item not in forbidden:
                  forbidden.append(item)
          authority_path.write_text(json.dumps(a, ensure_ascii=False, indent=2) + '\n')

          human_path = root / 'docs/research/TWO_WAVE_M0_AUTHORITY.md'
          h = human_path.read_text()
          section = '''\n\n## v0.6.51: left-boundary / internal-pivot correspondence decomposition — complete; mixed / unresolved\n\nFrozen protocol: `docs/research/TWO_WAVE_LEFT_BOUNDARY_INTERNAL_PIVOT_DECOMPOSITION_V0651_PROTOCOL.md`.  \nProtocol freeze commit: `ea6511289ab3131565bf13948f37663937e4dc41`.  \nFormal workflow run: `34667721079`.  \nFormal result commit: `459ea2ee7f7960af4db4e4a086348edc2911fec8`.  \nResult: `experiments/two_wave_left_boundary_internal_pivot_decomposition_v0651/RESULT.json`.  \nResult card: `experiments/two_wave_left_boundary_internal_pivot_decomposition_v0651/RESULT_CARD.md`.  \nGovernance adjudication: `experiments/two_wave_left_boundary_internal_pivot_decomposition_v0651/ADJUDICATION.json`.\n\nThe frozen `11` human-positive anchored cases show a strong descriptive start-side asymmetry but do not pass any preregistered mechanism category. Median absolute anchor error is `17, 13, 6, 11, 4` bars for `p0..p4`; `9/11` cases have larger start than end error. Removing a per-case rigid translation reduces median five-anchor MAE from `11.8` to `3.8` bars (`57.53%` median reduction), but median start/end offset disagreement remains `12` bars, so pure translation is rejected.\n\nAfter normalizing model and human parents to their own boundaries, median internal phase MAE is `0.0839727` and leg-share MAE `0.0756939`. Internal phase mismatch is not supported (`0.08397 < 0.12`), but the frozen strong correspondence / left-boundary rule required phase MAE `<=0.08`. The observed value narrowly misses that preregistered gate and must not be rounded into a pass.\n\nFormal verdict: **`v0651_correspondence_decomposition_mixed_or_unresolved`**.\n\nInterpretation: p0/start-side provenance and a removable temporal component are the strongest clues, while internal normalized geometry is comparatively close. But v0.6.51 does not authorize a left-boundary tolerance, translation correction, pivot remapping, parent challenger, qualification change, or direction challenger. The next authorized step moves into algorithm lineage: a separately frozen read-only audit of ordinal-0 predecessor support and first-valid publication to determine whether p0 is structurally generated differently from p1-p4.\n'''
          if '## v0.6.51: left-boundary / internal-pivot correspondence decomposition' not in h:
              h += section
          human_path.write_text(h)

          ledger_path = root / 'docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md'
          l = ledger_path.read_text()
          section2 = '''\n\n## v0.6.51 parent-anchor decomposition\n\n- Upstream parent-representation evidence only; not a direction contribution.\n- p0/p4 median absolute errors are `17`/`4` bars; start error dominates in `9/11`.\n- Translation removal reduces median five-anchor MAE from `11.8` to `3.8` bars, but boundary-offset disagreement median `12` rejects pure rigid translation.\n- Boundary-normalized internal phase MAE is `0.08397`: below the mismatch band but just above the frozen `0.08` correspondence band. No post-hoc relaxation is allowed.\n- Verdict: `v0651_correspondence_decomposition_mixed_or_unresolved`.\n- Next: ordinal-0 predecessor/publication lineage audit; direction research remains blocked.\n'''
          if '## v0.6.51 parent-anchor decomposition' not in l:
              l += section2
          ledger_path.write_text(l)

          index_path = root / 'docs/INDEX.md'
          idx = index_path.read_text()
          idx_section = '''\n\n### v0.6.51 left-boundary / internal-pivot decomposition — complete\n\n- Protocol: `research/TWO_WAVE_LEFT_BOUNDARY_INTERNAL_PIVOT_DECOMPOSITION_V0651_PROTOCOL.md`\n- Result: `../experiments/two_wave_left_boundary_internal_pivot_decomposition_v0651/RESULT.json`\n- Result card: `../experiments/two_wave_left_boundary_internal_pivot_decomposition_v0651/RESULT_CARD.md`\n- Governance adjudication: `../experiments/two_wave_left_boundary_internal_pivot_decomposition_v0651/ADJUDICATION.json`\n- Verdict: `v0651_correspondence_decomposition_mixed_or_unresolved`.\n- Next: freeze a read-only ordinal-0 predecessor-support / first-valid-publication lineage audit.\n'''
          if '### v0.6.51 left-boundary / internal-pivot decomposition — complete' not in idx:
              idx += idx_section
          index_path.write_text(idx)

          readme_path = root / 'README.md'
          r = readme_path.read_text()
          old = '''Current global stage is therefore **left-boundary / internal-pivot correspondence decomposition required**. v0.5.2 remains a supported research parent-identity component, but independent-reference correspondence is unresolved. Parent-direction winner remains unset; `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`. The next authorized action is a separately frozen read-only decomposition of start-boundary versus internal-pivot versus end-boundary correspondence. Fitting a 17-bar tolerance, fitting an anchor-MAE threshold, remapping pivots to the human labels, changing parent span to match labels, residual gate mining, or renewed direction micro-feature mining remain unauthorized.'''
          new = '''v0.6.51 completed the frozen left-boundary / internal-pivot decomposition. On the 11 human-positive anchored cases, p0/p4 median absolute errors are `17`/`4` bars and start error dominates in `9/11`; per-case translation removal reduces median five-anchor MAE from `11.8` to `3.8` bars. Yet the start/end offset disagreement median is `12` bars, so pure rigid translation is rejected. Boundary-normalized internal phase MAE is `0.08397`: below the internal-mismatch band but narrowly above the preregistered `0.08` correspondence/left-boundary band. The formal verdict is **`v0651_correspondence_decomposition_mixed_or_unresolved`**.\n\nCurrent global stage is therefore **ordinal-0 predecessor-support / first-valid-publication lineage audit required**. The start side is the strongest descriptive clue, but no start-boundary tolerance, translation correction, pivot remapping, semantic-object challenger, qualification change, or direction challenger is authorized. `morphology_acceptance=false`, `trade_authority=false`, `production_authority=false`.'''
          if old in r:
              r = r.replace(old, new)
          readme_path.write_text(r)
          PY

      - name: Commit v0651 governance closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/two_wave_m0_authority.json docs/research/TWO_WAVE_M0_AUTHORITY.md docs/research/TWO_WAVE_DIRECTION_CONTRIBUTION_LEDGER.md docs/INDEX.md README.md
          git commit -m "Close v0651 correspondence decomposition governance [skip ci]"
          git push origin HEAD:research/two-wave-left-boundary-internal-pivot-decomposition-v0651
